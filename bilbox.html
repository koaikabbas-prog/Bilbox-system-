<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14212B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>BILBOX — إدارة التوزيع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EC;--surface:#FFFFFF;--ink:#14212B;--ink-2:#2B3A44;--muted:#5E6B66;--line:#DCE3DD;--line-2:#E8EDE9;
  --pine:#0E6B5C;--pine-2:#0A5246;--pine-soft:#E1F0EB;
  --wheat:#E8A317;--wheat-ink:#7A5200;--wheat-soft:#FBF0D6;
  --red:#C2413B;--red-soft:#FBE9E7;--blue-soft:#E6EEF6;--blue-ink:#24527A;
  --r-lg:16px;--r-md:12px;--r-sm:9px;
  --font:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",system-ui,sans-serif;
  --nav-h:64px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--wheat);outline-offset:2px}
.num,.n{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;padding:0 0 calc(var(--nav-h) + 24px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;min-height:58px}
.topbar h1{font-size:18px;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{font-weight:700;font-size:15px;letter-spacing:.5px;color:var(--wheat);flex-shrink:0}
.back{background:rgba(255,255,255,.12);border:0;border-radius:10px;color:#fff;width:38px;height:38px;font-size:20px;display:grid;place-items:center}
.wrap{max-width:1120px;margin:0 auto;padding:16px}
.bnav{position:fixed;bottom:0;inset-inline:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
.bnav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--muted);font-weight:500}
.bnav button svg{width:22px;height:22px}
.bnav button.on{color:var(--pine)}
.bnav .fab span.ic{width:46px;height:46px;border-radius:15px;background:var(--wheat);color:var(--ink);display:grid;place-items:center;margin-top:-18px;box-shadow:0 6px 14px rgba(232,163,23,.35)}
.bnav .fab span.ic svg{width:24px;height:24px}
@media(min-width:960px){
  .side{display:flex;flex-direction:column;width:250px;background:var(--ink);color:#C9D3D0;position:sticky;top:0;height:100vh;padding:20px 14px;flex-shrink:0;overflow:auto}
  .side .logo{font-size:24px;font-weight:700;color:#fff;padding:4px 10px 2px}
  .side .logo b{color:var(--wheat)}
  .side .tagline{font-size:12px;color:#8FA19C;padding:0 10px 18px}
  .side button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:inherit;padding:10px 12px;border-radius:10px;text-align:right;font-size:14.5px}
  .side button svg{width:19px;height:19px;flex-shrink:0;opacity:.85}
  .side button:hover{background:rgba(255,255,255,.06)}
  .side button.on{background:rgba(232,163,23,.14);color:#fff}
  .side button.on svg{color:var(--wheat);opacity:1}
  .side .grp{font-size:11.5px;color:#7E908B;padding:16px 12px 4px}
  .side .newinv{margin-top:6px;background:var(--wheat);color:var(--ink);font-weight:600;justify-content:center}
  .side .newinv:hover{background:#F0B43A}
  .bnav{display:none}
  .main{padding-bottom:30px}
  .topbar{background:var(--bg);color:var(--ink);padding:22px 28px 6px;position:static}
  .topbar h1{font-size:24px;font-weight:700}
  .topbar .brand{display:none}
  .back{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
  .wrap{padding:14px 28px}
}

/* ---------- building blocks ---------- */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1}
.stack>*+*{margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card h2{font-size:16px;margin:0 0 12px;font-weight:600}
.card h2 small{font-weight:400;color:var(--muted);font-size:13px;margin-inline-start:6px}
.muted{color:var(--muted)}
.sm{font-size:13px}
.xs{font-size:12px}
.b{font-weight:600}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-size:21px;font-weight:700;margin-top:2px;direction:ltr;text-align:right}
.kpi.hot{background:var(--ink);border-color:var(--ink);color:#fff}
.kpi.hot .l{color:#AFC0BB}.kpi.hot .v{color:var(--wheat)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:11px;padding:10px 15px;font-weight:600;font-size:14.5px;background:var(--pine);color:#fff;min-height:42px;text-decoration:none}
.btn:hover{background:var(--pine-2)}
.btn svg{width:18px;height:18px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#F6F8F6}
.btn.gold{background:var(--wheat);color:var(--ink)}
.btn.gold:hover{background:#F0B43A}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{background:none;border:0;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--line-2);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}

.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.p-pending{background:var(--wheat-soft);color:var(--wheat-ink)}
.p-delivered{background:var(--pine-soft);color:var(--pine-2)}
.p-cancelled{background:#ECEFED;color:#77827D;text-decoration:line-through}
.p-received{background:var(--pine-soft);color:var(--pine-2)}
.p-debt{background:var(--red-soft);color:var(--red)}
.p-credit{background:var(--blue-soft);color:var(--blue-ink)}
.free-chip{display:inline-flex;align-items:center;gap:4px;background:var(--wheat-soft);color:var(--wheat-ink);border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:600}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;white-space:nowrap}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.search{position:relative;flex:1;min-width:200px}
.search input{width:100%;padding:11px 40px 11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.search svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line-2);background:none;border-inline:0;border-top:0;width:100%;text-align:right}
.li:last-child{border-bottom:0}
button.li:hover,.li.tap:hover{background:#F7F9F7}
.li .t{font-weight:600}
.li .s{font-size:12.5px;color:var(--muted)}
.li .end{margin-inline-start:auto;text-align:left;flex-shrink:0}
.li .amt{font-weight:700;direction:ltr}
.avatar{width:38px;height:38px;border-radius:11px;background:var(--pine-soft);color:var(--pine-2);display:grid;place-items:center;font-weight:700;flex-shrink:0}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:12px}

/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:#F7F9F7}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
table.t tfoot td{font-weight:700;border-top:1px solid var(--line);background:#F7F9F7}
table.t td.e,table.t th.e{text-align:left}

/* forms */
.fgrid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:620px){.fgrid{grid-template-columns:1fr 1fr}}
.fgrid .full{grid-column:1/-1}
.f label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;min-height:44px}
.f textarea{min-height:76px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--pine);box-shadow:0 0 0 3px rgba(14,107,92,.15)}
.f .hint{font-size:12px;color:var(--muted);margin-top:4px}
.f.bad input,.f.bad select{border-color:var(--red);box-shadow:0 0 0 3px rgba(194,65,59,.12)}
.check{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--pine)}

/* sheet (modal) */
.veil{position:fixed;inset:0;background:rgba(15,25,32,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
.veil.show{display:flex}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line-2)}
.sheet-h h3{margin:0;font-size:17px;flex:1}
.sheet-b{padding:16px;overflow:auto}
.sheet-f{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line-2);display:flex;gap:10px}
.sheet-f .btn{flex:1}
@media(min-width:700px){.veil{align-items:center}.sheet{border-radius:20px;max-height:86vh}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
#dlg{z-index:40}
#dlg .sheet{max-width:420px}

/* invoice editor */
.lines{display:flex;flex-direction:column;gap:10px}
.line{border:1px solid var(--line);border-radius:var(--r-md);padding:12px;background:#FBFCFB;position:relative}
.line .lgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.line .ltot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13.5px}
.line .rm{position:absolute;left:8px;top:8px}
.line .f label{font-size:12px}
.line .f input,.line .f select{min-height:42px;padding:9px 10px}
.totals{border-radius:var(--r-lg);background:var(--ink);color:#E9EFED;padding:16px}
.totals .r{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.totals .r .n{font-weight:600}
.totals .big{border-top:1px dashed rgba(255,255,255,.25);margin-top:8px;padding-top:10px;font-size:15px}
.totals .big .n{font-size:26px;font-weight:700;color:var(--wheat)}

/* documents (invoice/statement/print) */
.doc{background:#fff;color:#14212B;border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;max-width:760px;margin:0 auto}
.doc .dh{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:12px}
.doc .co{font-size:20px;font-weight:700}
.doc .co small{display:block;font-size:12.5px;font-weight:400;color:#5E6B66}
.doc .dt{text-align:left}
.doc .dt .k{font-size:18px;font-weight:700}
.doc .meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:13.5px;margin-bottom:12px}
.doc .sum{margin-top:10px;margin-inline-start:auto;width:min(300px,100%)}
.doc .sum .r{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #EEF1EC;font-size:14px}
.doc .sum .r.g{font-size:17px;font-weight:700;border-bottom:2px solid var(--ink)}
.doc .foot{margin-top:18px;font-size:12px;color:#5E6B66;text-align:center}
@media(max-width:560px){.doc{padding:14px}.doc table.t{font-size:13px}.doc table.t th,.doc table.t td{padding:7px 5px;white-space:normal}.doc .meta{grid-template-columns:1fr}.doc .co{font-size:17px}}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tri .f label{font-size:12px}.tri .f select{padding:9px 8px}
#printArea{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  body.printing>*:not(#printArea){display:none!important}
  body.printing #printArea{display:block}
  #printArea .doc{border:0;padding:0;max-width:none}
  #printArea .tbl-wrap{overflow:visible}
}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart .bar{fill:var(--pine)}
.chart .bar.today{fill:var(--wheat)}
.chart text{font-size:10px;fill:var(--muted);font-family:var(--font)}
.stockbar{height:8px;border-radius:99px;background:var(--line-2);overflow:hidden;margin-top:6px}
.stockbar b{display:block;height:100%;background:var(--pine);border-radius:99px}
.stockbar.low b{background:var(--red)}

.banner{background:var(--red-soft);color:#7E2420;border:1px solid #F1C9C5;border-radius:var(--r-md);padding:12px 14px;font-size:14px;margin-bottom:14px}
.info{background:var(--wheat-soft);color:#5C4100;border-radius:var(--r-md);padding:11px 14px;font-size:13.5px}
.toast{position:fixed;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;z-index:50;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:none;max-width:90vw;text-align:center}
@media(min-width:960px){.toast{bottom:24px}}
.more-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.more-grid{grid-template-columns:repeat(3,1fr)}}
.more-grid button{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:right;font-weight:600}
.more-grid button svg{width:24px;height:24px;color:var(--pine)}
.more-grid button span{font-weight:400;font-size:12.5px;color:var(--muted)}
.ledger td.neg{color:var(--blue-ink)}
hr.sep{border:0;border-top:1px solid var(--line-2);margin:14px 0}

/* v3 additions */
.app.auth .side{display:none}.app.auth .topbar{display:none}.app.auth .main{padding-bottom:20px}
.authbox{max-width:420px;margin:8vh auto 0;text-align:center}
.authbox .card{text-align:right}
.logo-big{font-size:40px;font-weight:700;letter-spacing:1px;color:var(--ink)}.logo-big b{color:var(--wheat)}
.sync{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:0;border-radius:10px;color:#fff;padding:6px 10px;font-size:12px}
.sync svg{width:16px;height:16px}.sync.off{background:#C2413B}
@media(min-width:960px){.sync{background:var(--surface);color:var(--muted);border:1px solid var(--line)}.sync.off{background:var(--red-soft);color:var(--red)}}
.btn.loading{opacity:.6;pointer-events:none}
.btn.loading::after{content:'';width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.side .tagline{line-height:1.5}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="wrap" id="view"></main>
  </div>
</div>
<nav class="bnav" id="bnav"></nav>
<div class="veil" id="sheet"><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-h"><h3 id="sheetTitle"></h3><button type="button" class="icon-btn" data-act="closeSheet" aria-label="إغلاق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="sheet-b" id="sheetBody"></div><div class="sheet-f" id="sheetFoot"></div></div></div>
<div class="veil" id="dlg"><div class="sheet" role="alertdialog" aria-modal="true"><div class="sheet-b"><p id="dlgText" style="margin:4px 0 12px;line-height:1.9;white-space:pre-line"></p><div class="f" id="dlgInputWrap" style="display:none"><input id="dlgInput" autocomplete="off"></div></div><div class="sheet-f"><button type="button" class="btn" id="dlgOk">تأكيد</button><button type="button" class="btn ghost" id="dlgCancel">إلغاء</button></div></div></div>
<div class="toast" id="toast" role="status"></div>
<div id="printArea"></div>
<script>
'use strict';
/* =========================================================
   BILBOX v3 — نسخة أونلاين مشتركة (Supabase)
   كل الموظفين يعملون على نفس البيانات. الصلاحيات تُفرض داخل قاعدة البيانات.
   ========================================================= */
const SB_URL='https://aalsauiijbrbuuanievb.supabase.co',SB_KEY='sb_publishable_5aGxNtl18sP2UJpBfbbKDg_KvLElALT',DOMAIN='bilbox.app';
const OLDKEY='bilbox_v2',SESSKEY='bilbox_session',CACHEKEY='bilbox_cache_v3';
let storageOK=true;try{localStorage.setItem('__bx','1');localStorage.removeItem('__bx')}catch(e){storageOK=false}
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};

/* ---------- utils ---------- */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const pad=x=>String(x).padStart(2,'0');
const isoDate=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>isoDate(new Date());
const n=v=>{let x=Number(v);return Number.isFinite(x)?x:0};
const r2=v=>Math.round((n(v)+Number.EPSILON)*100)/100;
const fmt=v=>{let x=r2(v);return (x<0?'-':'')+'$'+Math.abs(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})};
const fmt0=v=>{let x=Math.round(n(v));return (x<0?'-':'')+'$'+Math.abs(x).toLocaleString('en-US')};
const num=v=>n(v).toLocaleString('en-US',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M=v=>`<span class="n">${fmt(v)}</span>`;
const N=v=>`<span class="n">${num(v)}</span>`;
const monthsAr=['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
const dateAr=s=>{if(!s)return'';let[y,m,d]=String(s).slice(0,10).split('-');return `${+d} ${monthsAr[+m-1]} ${y}`};
const initials=s=>String(s||'?').trim().slice(0,1);
const jwtSub=t=>{try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).sub}catch(e){return null}};

/* ---------- icons ---------- */

class AuthError extends Error{constructor(m){super(m||'انتهت الجلسة. سجّل الدخول مجدداً.');this.auth=true}}
class NetError extends Error{constructor(){super('لا يوجد اتصال بالإنترنت. تحقق من الشبكة وحاول مرة أخرى.');this.net=true}}
let session=null;
function loadSession(){try{session=JSON.parse(store.get(SESSKEY)||'null')}catch(e){session=null}}
function saveSession(){if(session)store.set(SESSKEY,JSON.stringify(session));else store.del(SESSKEY)}
function setSession(j){session={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+n(j.expires_in||3600)*1000,uid:jwtSub(j.access_token)};saveSession()}
function authErr(j){const m=String(j?.error_description||j?.msg||j?.message||j?.error||'');if(/invalid login|invalid_grant|credentials/i.test(m))return'اسم المستخدم أو كلمة السر غير صحيحة.';if(/banned/i.test(m))return'هذا الحساب موقوف. راجع المدير.';if(/password/i.test(m)&&/6|short|weak/i.test(m))return'كلمة السر 6 أحرف على الأقل.';return m||'تعذّر الاتصال بالخادم.'}
async function authPost(path,body){let r;try{r=await fetch(SB_URL+'/auth/v1/'+path,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)})}catch(e){throw new NetError()}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(authErr(j));return j}
let refreshing=null;
async function token(){
  if(!session)throw new AuthError();
  if(Date.now()>session.expires_at-60000){
    if(!refreshing)refreshing=(async()=>{try{setSession(await authPost('token?grant_type=refresh_token',{refresh_token:session.refresh_token}))}catch(e){if(e.net)throw e;session=null;saveSession();throw new AuthError()}finally{refreshing=null}})();
    await refreshing;
  }
  return session.access_token;
}
function pgErr(j,status){const m=String(j?.message||'');if(/row-level security|permission denied|42501/i.test(m+j?.code))return'ليس لديك صلاحية لهذا الإجراء.';if(/foreign key|23503/i.test(m+j?.code))return'لا يمكن الحذف: هذا السجل مستعمل في فواتير أو حركات أخرى.';if(/duplicate|23505/i.test(m+j?.code))return'هذا السجل موجود مسبقاً.';return m||('حدث خطأ ('+status+')')}
async function api(method,path,body,headers={}){
  const tok=await token();let r;
  try{r=await fetch(SB_URL+'/rest/v1/'+path,{method,headers:{apikey:SB_KEY,Authorization:'Bearer '+tok,'Content-Type':'application/json',Prefer:'return=representation',...headers},body:body==null?undefined:JSON.stringify(body)})}catch(e){throw new NetError()}
  if(r.status===401){session=null;saveSession();throw new AuthError()}
  const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null}catch(e){}
  if(!r.ok)throw new Error(pgErr(j,r.status));
  return j;
}
const rpc=(fn,args={})=>api('POST','rpc/'+fn,args);
async function selectAll(table,q='select=*'){let out=[],from=0;const step=1000;for(;;){const part=await api('GET',`${table}?${q}`,null,{Range:`${from}-${from+step-1}`,Prefer:'count=none'});out=out.concat(part||[]);if(!part||part.length<step)break;from+=step}return out}
async function adminFn(body){const h={apikey:SB_KEY,'Content-Type':'application/json'};if(session)h.Authorization='Bearer '+await token();let r;try{r=await fetch(SB_URL+'/functions/v1/admin-users',{method:'POST',headers:h,body:JSON.stringify(body)})}catch(e){throw new NetError()}const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw new Error(j.error||'تعذّر تنفيذ الطلب.');return j}
async function login(username,password){setSession(await authPost('token?grant_type=password',{email:username.trim().toLowerCase()+'@'+DOMAIN,password}))}
async function changePassword(pw){const tok=await token();let r;try{r=await fetch(SB_URL+'/auth/v1/user',{method:'PUT',headers:{apikey:SB_KEY,Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({password:pw})})}catch(e){throw new NetError()}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(authErr(j))}
async function logout(){try{if(session)fetch(SB_URL+'/auth/v1/logout',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+session.access_token}}).catch(()=>{})}catch(e){}session=null;saveSession();me=null;db=emptyDb();draft=null;hist=[];route={page:'login',arg:null};render()}

const P=id=>byId(db.products,id),C=id=>byId(db.customers,id),T=id=>byId(db.team,id)||byId(db.profiles,id),S=id=>byId(db.suppliers,id),INV=id=>byId(db.invoices,id);

/* ---------- costing & stock ---------- */
function landedLines(pu){
  let value=pu.lines.reduce((a,l)=>a+n(l.qty)*n(l.unitCost),0),qty=pu.lines.reduce((a,l)=>a+n(l.qty),0);
  let extra=n(pu.freight)+n(pu.customs)+n(pu.other);
  return pu.lines.map(l=>{let v=n(l.qty)*n(l.unitCost);let share=value>0?v/value:(qty>0?n(l.qty)/qty:0);let total=v+extra*share;return{productId:l.productId,qty:n(l.qty),value:total,unit:n(l.qty)?total/n(l.qty):0}});
}
function purchaseTotal(pu){return pu.lines.reduce((a,l)=>a+n(l.qty)*n(l.unitCost),0)+n(pu.freight)+n(pu.customs)+n(pu.other)}
const avgCost=pid=>db.avg[pid]??(P(pid)?.cost||0);
const ZERO={opening:0,received:0,sold:0,returned:0,adjusted:0,reserved:0,stock:0,available:0};
const moves=pid=>db.stock[pid]||ZERO;
const stockOf=pid=>moves(pid).stock,availOf=pid=>moves(pid).available;

/* ---------- money ---------- */
const linesNet=lines=>lines.reduce((a,l)=>a+n(l.qty)*n(l.price),0);
const invNet=i=>r2(linesNet(i.lines)),invVat=i=>r2(invNet(i)*n(i.vat)/100),invGross=i=>r2(invNet(i)+invVat(i));
const retNet=r=>r2(linesNet(r.lines)),retVat=r=>r2(retNet(r)*n(r.vat)/100),retGross=r=>r2(retNet(r)+retVat(r));
const invCartons=i=>i.lines.reduce((a,l)=>a+n(l.qty)+n(l.free),0);
function custBalance(cid){
  let c=C(cid),b=n(c?.opening);
  for(const i of db.invoices)if(i.customerId===cid&&i.status==='delivered')b+=invGross(i);
  for(const r of db.returns)if(r.customerId===cid)b-=retGross(r);
  for(const p of db.payments)if(p.customerId===cid)b-=n(p.amount);
  return r2(b);
}
const totalReceivable=()=>r2(db.customers.reduce((a,c)=>a+Math.max(0,custBalance(c.id)),0));
function invPaid(inv){return r2(db.payments.filter(p=>p.invoiceId===inv.id).reduce((a,p)=>a+n(p.amount),0))}
function returnedQty(inv,idx){let q=0,f=0;for(const r of db.returns)if(r.invoiceId===inv.id)for(const l of r.lines)if(l.idx===idx){q+=n(l.qty);f+=n(l.free)}return{q,f}}
function priceFor(p,c){if(!p)return 0;return c?.type==='wholesale'?n(p.priceWholesale):n(p.priceRetail)}
function promoFree(p,c,qty){if(!p||!c||n(p.promoEvery)<=0)return 0;if(c.type==='wholesale'&&!p.promoWholesale)return 0;return Math.floor(n(qty)/n(p.promoEvery))}

const inRange=(d,a,b)=>(!a||d>=a)&&(!b||d<=b);
function periodSummary(a,b){
  let net=0,vat=0,cogs=0,cartons=0,free=0,retNetT=0,retVatT=0,retCost=0,exp=0,inVat=0;
  const byP={},byC={},byR={};
  for(const i of db.invoices){if(i.status!=='delivered'||!inRange(i.deliveredAt||i.date,a,b))continue;
    let iv=n(i.vat);
    for(const l of i.lines){let ln=n(l.qty)*n(l.price),lc=(n(l.qty)+n(l.free))*n(l.cost);net+=ln;vat+=ln*iv/100;cogs+=lc;cartons+=n(l.qty)+n(l.free);free+=n(l.free);
      let bp=byP[l.productId]||(byP[l.productId]={qty:0,free:0,net:0,cogs:0});bp.qty+=n(l.qty);bp.free+=n(l.free);bp.net+=ln;bp.cogs+=lc}
    let bc=byC[i.customerId]||(byC[i.customerId]={net:0,count:0});bc.net+=invNet(i);bc.count++;
    let k=i.repId||'-';let br=byR[k]||(byR[k]={net:0,count:0,cartons:0});br.net+=invNet(i);br.count++;br.cartons+=invCartons(i)}
  for(const r of db.returns){if(!inRange(r.date,a,b))continue;let rn=retNet(r);retNetT+=rn;retVatT+=retVat(r);
    for(const l of r.lines){let lc=(n(l.qty)+n(l.free))*n(l.cost);retCost+=lc;let bp=byP[l.productId]||(byP[l.productId]={qty:0,free:0,net:0,cogs:0});bp.qty-=n(l.qty);bp.free-=n(l.free);bp.net-=n(l.qty)*n(l.price);bp.cogs-=lc}
    let bc=byC[r.customerId]||(byC[r.customerId]={net:0,count:0});bc.net-=rn}
  for(const e of db.expenses)if(inRange(e.date,a,b))exp+=n(e.amount);
  for(const pu of db.purchases)if(pu.status==='received'&&inRange(pu.receivedAt||pu.date,a,b))inVat+=n(pu.customsVat);
  let sales=net-retNetT,cost=cogs-retCost,gross=sales-cost;
  return{sales,cost,gross,exp,netProfit:gross-exp,margin:sales?gross/sales*100:0,outVat:vat-retVatT,inVat,cartons,free,byP,byC,byR,returns:retNetT};
}

  const done=v=>{d.classList.remove('show');ok.onclick=cn.onclick=null;res(v)};ok.onclick=()=>done(opt.input?inp.value.trim():true);cn.onclick=()=>done(opt.input?null:false);setTimeout(()=>(opt.input?inp:ok).focus(),60)})}

function openSheet(title,body,{save,saveLabel='حفظ',extra=''}={}){$('#sheetTitle').textContent=title;$('#sheetBody').innerHTML=body;sheetSave=save||null;$('#sheetFoot').innerHTML=(save?`<button type="button" class="btn" data-act="sheetSave" id="sheetSaveBtn">${saveLabel}</button>`:'')+extra+`<button type="button" class="btn ghost" data-act="closeSheet">${save?'إلغاء':'إغلاق'}</button>`;$('#sheet').classList.add('show');setTimeout(()=>{let f=$('#sheetBody input:not([type=hidden]):not([type=checkbox]),#sheetBody select');if(f&&window.innerWidth>700)f.focus()},80)}

const fld=(label,name,v='',{type='text',req=false,attrs='',hint='',full=false}={})=>`<div class="f${full?' full':''}"><label for="f_${name}">${label}${req?' *':''}</label><input id="f_${name}" name="${name}" type="${type}" value="${esc(v)}" ${req?'required':''} ${type==='number'?'inputmode="decimal" step="any"':''} ${attrs}>${hint?`<div class="hint">${hint}</div>`:''}</div>`;

function readForm(root){let o={};root.querySelectorAll('[name]').forEach(el=>{o[el.name]=el.type==='checkbox'?el.checked:el.value});return o}
function validate(root){root.querySelectorAll('.f.bad').forEach(x=>x.classList.remove('bad'));for(const el of root.querySelectorAll('input,select,textarea')){if(el.willValidate&&!el.checkValidity()){let f=el.closest('.f');f&&f.classList.add('bad');let lab=f?.querySelector('label')?.textContent.replace('*','').trim()||'الحقل';msg(lab+': '+(el.validity.valueMissing?'هذا الحقل مطلوب':el.validity.rangeUnderflow?'القيمة أقل من المسموح':'القيمة غير صحيحة'));try{el.focus()}catch(e){}return false}}return true}
const optsOf=(list,emptyLabel)=>[...(emptyLabel!=null?[['',emptyLabel]]:[]),...list.map(x=>[x.id,x.name||x.full_name])];
function statusPill(s){return `<span class="pill p-${s}">${{pending:'قيد التجهيز',delivered:'مسلّمة',cancelled:'ملغاة',received:'مستلمة'}[s]||s}</span>`}

  let pending=db.invoices.filter(i=>i.status==='pending');

  }else{
    kpis=`<div class="kpi hot"><div class="l">${R('sales_rep')?'مبيعاتي اليوم':'مبيعات اليوم'}</div><div class="v">${fmt0(day.sales)}</div></div><div class="kpi"><div class="l">${R('sales_rep')?'مبيعاتي هذا الشهر':'مبيعات الشهر'}</div><div class="v">${fmt0(mon.sales)}</div></div>`
     +(can('seeCosts')?`<div class="kpi"><div class="l">الربح الإجمالي للشهر</div><div class="v">${fmt0(mon.gross)}</div></div>`:'')

     +(can('seeCosts')?`<div class="kpi"><div class="l">قيمة المخزون بالكلفة</div><div class="v">${fmt0(db.products.reduce((a,p)=>a+Math.max(0,stockOf(p.id))*avgCost(p.id),0))}</div></div>`:'');
  }
  let chart='';

    let vals=days.map(d=>db.invoices.filter(i=>i.status==='delivered'&&(i.deliveredAt||i.date)===d).reduce((a,i)=>a+invNet(i),0));
    let mx=Math.max(1,...vals),W=700,H=170,bw=W/14;
    let bars=vals.map((v,k)=>{let h=Math.max(v>0?3:0,(v/mx)*(H-40));let x=W-(k+1)*bw+6;return `<rect class="bar${k===13?' today':''}" x="${x}" y="${H-22-h}" width="${bw-12}" height="${h}" rx="4"><title>${days[k]}: ${fmt(v)}</title></rect><text x="${x+(bw-12)/2}" y="${H-6}" text-anchor="middle">${+days[k].slice(8)}</text>`}).join('');
    chart=`<div class="card"><h2>المبيعات المسلّمة<small>آخر 14 يوماً، قبل الضريبة</small></h2><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="مبيعات آخر 14 يوماً">${bars}</svg></div>`;
  }
  let debtors=can('balances')?db.customers.map(c=>({c,b:custBalance(c.id)})).filter(x=>x.b>0.004).sort((a,b)=>b.b-a.b).slice(0,5):[];
  let recent=(R('warehouse')?pending:db.invoices).slice().sort((a,b)=>(b.date+b.no).localeCompare(a.date+a.no)).slice(0,R('warehouse')?20:6);
  let stockRows=db.products.filter(p=>p.active!==false).map(p=>{let m=moves(p.id);let low=m.available<=n(p.reorder);let pct=Math.max(3,Math.min(100,n(p.reorder)>0?m.available/(n(p.reorder)*2)*100:100));return `<div style="padding:8px 0;border-bottom:1px solid var(--line-2)"><div class="row between"><span class="b">${esc(p.name)}</span><span class="sm ${low?'b':''}" style="color:${low?'var(--red)':'inherit'}">${N(m.available)} ${esc(p.unit)} متاح</span></div><div class="stockbar${low?' low':''}"><b style="width:${pct}%"></b></div>${low&&n(p.reorder)>0?`<div class="xs" style="color:var(--red);margin-top:3px">تحت حد إعادة الطلب (${N(p.reorder)})</div>`:''}</div>`}).join('');

  <div class="grid2"><div class="card"><h2>المخزون المتاح</h2>${stockRows||'<div class="empty">لا منتجات</div>'}</div>
   ${can('balances')?`<div class="card"><h2>أكبر الديون</h2>${debtors.length?`<div class="list" style="border:0">${debtors.map(x=>`<button type="button" class="li" data-act="openCustomer" data-id="${x.c.id}"><span class="avatar">${esc(initials(x.c.name))}</span><span><span class="t">${esc(x.c.name)}</span><br><span class="s">${esc(x.c.area||CTYPES[x.c.type])}</span></span><span class="end amt" style="color:var(--red)">${fmt(x.b)}</span></button>`).join('')}</div>`:'<div class="empty">لا ديون</div>'}</div>`:''}</div>

  return{title:'لوحة اليوم',html};
};

function draftTotals(){let o={vat:db.settings.vat,lines:draft.lines};return{net:invNet(o),vat:invVat(o),gross:invGross(o),cartons:draft.lines.reduce((a,l)=>a+n(l.qty)+n(l.free),0),free:draft.lines.reduce((a,l)=>a+n(l.free),0)}}

function onLineChange(k,key,val){
  let l=draft.lines[k];if(!l)return;let c=C(draft.customerId);
  if(key==='productId'){l.productId=val;let p=P(val);l.price=priceFor(p,c);l.free=promoFree(p,c,l.qty);l.auto=true;render();return}
  if(key==='qty'){l.qty=val;if(l.auto){l.free=promoFree(P(l.productId),c,val);let fi=$(`[data-line="${k}"][data-key="free"]`);if(fi&&fi!==document.activeElement)fi.value=l.free}}
  if(key==='price')l.price=val;
  if(key==='free'){l.free=val;l.auto=false}
  let lt=$('#lt_'+k),lw=$('#lw_'+k),tt=$('#drTotals');
  if(lt)lt.innerHTML=M(n(l.qty)*n(l.price));if(lw)lw.innerHTML=lineWarn(l,c);if(tt)tt.innerHTML=draftTotalsHtml(draftTotals());
}
async function saveInvoice(){
  let c=C(draft.customerId);
  if(!c)return msg('اختر الزبون.');
  let lines=draft.lines.filter(l=>l.productId);
  if(!lines.length)return msg('أضف صنفاً واحداً على الأقل.');
  for(const l of lines){let p=P(l.productId);
    if(!Number.isInteger(n(l.qty))||n(l.qty)<1)return msg(`${p.name}: الكمية يجب أن تكون رقماً صحيحاً 1 أو أكثر.`);
    if(!Number.isInteger(n(l.free))||n(l.free)<0)return msg(`${p.name}: الكمية المجانية غير صحيحة.`);
    if(n(l.price)<=0)return msg(`${p.name}: أدخل سعر البيع.`);
    if(c.type==='wholesale'&&n(p.minWholesale)>0&&n(l.qty)<n(p.minWholesale))return msg(`${p.name}: الحد الأدنى لتاجر الجملة ${num(p.minWholesale)} ${p.unit}.`);
    let exp=promoFree(p,c,l.qty);if(n(p.promoEvery)>0&&n(l.free)>exp&&!(await ask(`${p.name}: الكمية المجانية (${num(l.free)}) أكثر من العرض المعتاد (${num(exp)}). هل تريد المتابعة؟`)))return}
  const payload={id:draft.editId||'',customer_id:c.id,date:draft.date||today(),rep_id:R('sales_rep')?me.id:(draft.repId||''),driver_id:draft.driverId||'',vehicle_id:draft.vehicleId||'',notes:draft.notes||'',lines:lines.map(l=>({product_id:l.productId,qty:n(l.qty),free:n(l.free),price:r2(l.price)}))};
  const d=draft;
  const res=await run(async()=>{
    const inv=await rpc('save_invoice',{p:payload});
    if(!d.editId&&(d.deliverNow||d.cashNow))await rpc('deliver_invoice',{inv_id:inv.id,cash:!!d.cashNow});
    return inv;
  },inv=>d.editId?'تم حفظ التعديلات':(d.cashNow?'تم الحفظ والتسليم والقبض':d.deliverNow?'تم حفظ الفاتورة وتسليمها':'تم حفظ الفاتورة '+inv.no));
  if(res&&res.id){draft=null;hist=hist.filter(h=>h.page!=='invoiceEdit');route={page:'invoice',arg:res.id};render();window.scrollTo(0,0)}
}

function ledger(cid){
  let c=C(cid),rows=[];
  if(n(c?.opening))rows.push({date:'',ref:'',desc:'رصيد افتتاحي',dr:n(c.opening),cr:0});
  for(const i of db.invoices)if(i.customerId===cid&&i.status==='delivered')rows.push({date:i.deliveredAt||i.date,ref:i.no,desc:'فاتورة',dr:invGross(i),cr:0,id:i.id});
  for(const r of db.returns)if(r.customerId===cid)rows.push({date:r.date,ref:r.no,desc:'مرتجع',dr:0,cr:retGross(r)});
  for(const p of db.payments)if(p.customerId===cid)rows.push({date:p.date,ref:p.no,desc:'قبض '+(METHODS[p.method]||''),dr:0,cr:n(p.amount)});
  rows.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||String(a.ref).localeCompare(String(b.ref)));
  let bal=0;for(const r of rows){bal=r2(bal+r.dr-r.cr);r.bal=bal}return rows;
}

    const res=await run(async()=>{if(id){await api('PATCH','customers?id=eq.'+encodeURIComponent(id),o);return{id}}const r=await api('POST','customers',o);return r[0]},id?'تم حفظ التعديلات':'تمت إضافة '+o.name);

}

function paymentForm(customerId='',invoiceId=''){
  if(!can('payCreate'))return;
  if(!db.customers.length)return msg('لا يوجد زبائن.');
  let c=C(customerId),bal=c?custBalance(c.id):0;
  openSheet('تسجيل قبض',`<div class="fgrid">${sel('الزبون','customerId',[['','اختر الزبون'],...db.customers.map(x=>[x.id,x.name+' — رصيد '+fmt(custBalance(x.id))])],customerId,{full:true,attrs:'data-on="payCust"'})}${fld('المبلغ $','amount',bal>0?r2(bal):'',{type:'number',req:true,attrs:'min="0.01"',hint:'مقترح: كامل الرصيد المستحق'})}${fld('التاريخ','date',today(),{type:'date',req:true})}${sel('الطريقة','method',Object.entries(METHODS),'cash')}${R('sales_rep')?'':sel('قبضه المندوب','repId',optsOf(reps(),'—'),c?.repId||'')}<input type="hidden" name="invoiceId" value="${esc(invoiceId)}">${area('ملاحظات','notes','')}</div>`,{save:async()=>{
    let b=$('#sheetBody');if(!validate(b))return;let f=readForm(b);let cc=C(f.customerId);if(!cc)return msg('اختر الزبون.');let amt=r2(f.amount);if(amt<=0)return msg('أدخل مبلغاً أكبر من صفر.');
    let bl=custBalance(cc.id);
    if(amt>bl+0.004&&!(await ask(`المبلغ (${fmt(amt)}) أكبر من الرصيد المستحق (${fmt(bl)}). سيصبح للزبون رصيد لصالحه. متابعة؟`)))return;
    const row={date:f.date,customer_id:cc.id,invoice_id:f.invoiceId||null,amount:amt,method:f.method,rep_id:R('sales_rep')?me.id:(f.repId||null),notes:f.notes.trim()};
    if(await run(()=>api('POST','payments',row),'تم تسجيل قبض '+fmt(amt)+' من '+cc.name))closeSheet()}});
}

function openingForm(){
  openSheet('مخزون البداية',`<div class="stack"><div class="info">أدخل الكمية الموجودة فعلاً في المستودع، وكلفة الوحدة الواصلة.</div>${db.products.map(p=>`<div class="line"><div class="b">${esc(p.name)} <span class="xs muted">(${esc(p.unit)})</span></div><div class="lgrid" style="grid-template-columns:1fr 1fr"><div class="f"><label>الكمية</label><input type="number" inputmode="numeric" min="0" step="1" name="o_${p.id}" value="${n(p.opening)}"></div><div class="f"><label>كلفة الوحدة $</label><input type="number" inputmode="decimal" min="0" step="0.01" name="c_${p.id}" value="${n(p.cost)}"></div></div></div>`).join('')}</div>`,{save:async()=>{

async function savePurchase(){
  let d=draft,locked=d.editId&&byId(db.purchases,d.editId)?.status==='received';
  if(locked){if(await run(()=>api('PATCH','purchases?id=eq.'+encodeURIComponent(d.editId),{notes:d.notes}),'تم الحفظ')){draft=null;back()}return}
  let lines=d.lines.filter(l=>l.productId&&n(l.qty)>0);
  if(!lines.length)return msg('أدخل صنفاً بكمية أكبر من صفر.');
  if(lines.some(l=>!Number.isInteger(n(l.qty))))return msg('الكميات يجب أن تكون أرقاماً صحيحة.');
  if(lines.some(l=>n(l.unitCost)<0)||['freight','customs','customsVat','other'].some(k=>n(d[k])<0))return msg('المبالغ لا يمكن أن تكون سالبة.');
  if(d.status==='received'&&!(await ask('تأكيد استلام البضاعة وإضافتها إلى المخزون؟ بعد الاستلام لا يمكن تعديل الكميات والكلفة.')))return;
  const head={supplier_id:d.supplierId||null,date:d.date||today(),lines:lines.map(l=>({product_id:l.productId,qty:n(l.qty)})),notes:d.notes||''};
  const cost={unit_costs:lines.map(l=>r2(l.unitCost)),freight:r2(d.freight),customs:r2(d.customs),customs_vat:r2(d.customsVat),other:r2(d.other)};
  const ok=await run(async()=>{let id=d.editId;if(id)await api('PATCH','purchases?id=eq.'+encodeURIComponent(id),head,{Prefer:'return=minimal'});else id=(await api('POST','purchases',head))[0].id;
    await api('POST','purchase_costs',{purchase_id:id,...cost},{Prefer:'resolution=merge-duplicates,return=minimal'});
    if(d.status==='received')await rpc('receive_purchase',{pur_id:id})},d.status==='received'?'تم استلام الشحنة وإضافتها للمخزون':'تم حفظ الشحنة');
  if(ok){draft=null;hist=hist.filter(h=>h.page!=='purchaseEdit');route={page:'purchases',arg:null};render();window.scrollTo(0,0)}
}

function closingData(rep,d){
  let invs=db.invoices.filter(i=>i.status==='delivered'&&i.repId===rep&&(i.deliveredAt||i.date)===d);
  let pays=db.payments.filter(p=>p.repId===rep&&p.date===d);

}

function showDoc(title,html){openSheet(title,html,{extra:`<button type="button" class="btn" data-act="doPrint">${ic('print')} طباعة</button>`});$('#printArea').innerHTML=html}
function doPrint(){document.body.classList.add('printing');try{window.print()}catch(e){}setTimeout(()=>document.body.classList.remove('printing'),500)}
window.addEventListener('afterprint',()=>document.body.classList.remove('printing'));
function download(name,text,type){try{let blob=new Blob([text],{type}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);return true}catch(e){return false}}
function exportCSV(){let[a,b]=rptRange(),costs=can('seeCosts');let rows=[['الفاتورة','تاريخ التسليم','الزبون','المندوب','المنتج','الكمية','مجاني','السعر','المبلغ',...(costs?['الكلفة','الربح']:[])]];
  for(const i of db.invoices)if(i.status==='delivered'&&inRange(i.deliveredAt||i.date,a,b))for(const l of i.lines){let amt=r2(n(l.qty)*n(l.price)),cst=r2((n(l.qty)+n(l.free))*n(l.cost));rows.push([i.no,i.deliveredAt||i.date,cName(i.customerId),i.repId?tName(i.repId):'',pName(l.productId),l.qty,l.free,l.price,amt,...(costs?[cst,r2(amt-cst)]:[])])}
  let csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
  if(download('BILBOX-sales-'+(a||'all')+'.csv',csv,'text/csv;charset=utf-8'))toast('تم تنزيل الملف')}
function exportBackup(){download('BILBOX-backup-'+today()+'.json',JSON.stringify({exportedAt:new Date().toISOString(),by:me.username,db}),'application/json');toast('بدأ تنزيل النسخة')}
async function doImport(data){
  if(!data||!Array.isArray(data.products)||!(Array.isArray(data.invoices)||Array.isArray(data.orders)))return msg('الملف ليس نسخة احتياطية من BILBOX.');
  if(Array.isArray(data.orders)&&!Array.isArray(data.invoices))return msg('هذا ملف من النسخة الأولى. افتحه في النسخة الثانية أولاً ثم نزّل منها نسخة احتياطية.');
  let s=`سيتم نقل: ${data.products.length} منتج، ${(data.customers||[]).length} زبون، ${(data.invoices||[]).length} فاتورة، ${(data.payments||[]).length} سند قبض، ${(data.purchases||[]).length} شحنة. متابعة؟`;
  if(!(await ask(s,{ok:'نقل البيانات'})))return;
  await run(()=>rpc('import_v2',{d:data}),r=>`تم النقل: ${r?.customers??0} زبون و${r?.invoices??0} فاتورة. وزّع الزبائن على المندوبين من صفحة كل زبون.`);
}

document.addEventListener('click',e=>{let el=e.target.closest('[data-act]');if(!el||el.disabled)return;let fn=A[el.dataset.act];if(fn){e.preventDefault();fn(el.dataset,el)}});
const ON={
 invQ:v=>{ui.invQ=v;let a=$('#listArea');if(a)a.innerHTML=invListHtml()},custQ:v=>{ui.custQ=v;let a=$('#listArea');if(a)a.innerHTML=custListHtml()},
 repFilter:v=>{ui.repFilter=v;render()},expMonth:v=>{ui.expMonth=v;render()},

 payCust:v=>{let a=$('#sheetBody [name=amount]'),r=$('#sheetBody [name=repId]');let b=custBalance(v);if(a)a.value=b>0?r2(b):'';let c=C(v);if(r&&c?.repId)r.value=c.repId}
};
function handleField(e){
  let el=e.target;
  if(el.dataset.on&&ON[el.dataset.on]){ON[el.dataset.on](el.value);return}
  if(!draft)return;
  if(el.dataset.line!=null){onLineChange(+el.dataset.line,el.dataset.key,el.value);return}
  if(el.dataset.draft){let k=el.dataset.draft,v=el.type==='checkbox'?el.checked:el.value;draft[k]=v;
    if(k==='customerId'){let c=C(v);if(!R('sales_rep'))draft.repId=c?.repId||draft.repId||'';for(const l of draft.lines){let p=P(l.productId);l.price=priceFor(p,c);if(l.auto)l.free=promoFree(p,c,l.qty)}render()}
    else if(k==='cashNow'&&v){draft.deliverNow=true;render()}else if(k==='deliverNow'&&!v&&draft.cashNow){draft.cashNow=false;render()}
    return}
  if(el.dataset.pline!=null){let l=draft.lines[+el.dataset.pline];l[el.dataset.key]=el.value;refreshPurchaseLight();return}
  if(el.dataset.pdraft){let k=el.dataset.pdraft;if(k==='received'){draft.status=el.checked?'received':'pending';return}draft[k]=el.value;if(['freight','customs','other','customsVat'].includes(k))refreshPurchaseLight();return}
}
document.addEventListener('input',e=>{let el=e.target;if(el.tagName==='SELECT'||el.type==='checkbox'||el.type==='date'||el.type==='month'||el.type==='file')return;handleField(e)});
document.addEventListener('change',e=>{let el=e.target;if(el.tagName==='SELECT'||el.type==='checkbox'||el.type==='date'||el.type==='month')handleField(e)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#dlg').classList.contains('show'))$('#dlgCancel').click();else if($('#sheet').classList.contains('show'))closeSheet()}
  if(e.key==='Enter'&&e.target.tagName==='INPUT'){if(e.target.id==='dlgInput'){e.preventDefault();$('#dlgOk').click()}else if(e.target.closest('#sheetBody')&&$('#sheetSaveBtn')){e.preventDefault();$('#sheetSaveBtn').click()}else if(e.target.closest('#authForm')){e.preventDefault();$('#authForm .btn.gold')?.click()}}
});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
window.addEventListener('beforeunload',e=>{if(draft){e.preventDefault();e.returnValue=''}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&me&&Date.now()-loadedAt>15000)refresh({silent:true})});
window.addEventListener('online',()=>{if(me)refresh({silent:true})});
window.addEventListener('offline',()=>{online=false;if(me&&!draft)render()});

/* ---------- start ---------- */
async function boot(){
  loadSession();
  if(session&&loadCache()){booting=false;render()}
  if(session){
    try{await loadAll();booting=false;render()}
    catch(e){booting=false;if(e.auth){session=null;saveSession();me=null;route={page:'login',arg:null};render();if(e.message)msg(e.message)}else if(me){online=false;render()}else{route={page:'login',arg:null};render();msg(e.message)}}
  }else{
    try{needsBootstrap=!!(await adminFn({action:'status'})).needs_bootstrap}catch(e){}
    booting=false;route={page:'login',arg:null};render();
  }
  setInterval(()=>{if(me&&document.visibilityState==='visible'&&!busy)refresh({silent:true})},30000);
}
boot();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
