<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14212B">
<title>BILBOX — إدارة التوزيع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EC;--surface:#FFFFFF;--ink:#14212B;--ink-2:#2B3A44;--muted:#5E6B66;--line:#DCE3DD;--line-2:#E8EDE9;
  --pine:#0E6B5C;--pine-2:#0A5246;--pine-soft:#E1F0EB;
  --wheat:#E8A317;--wheat-ink:#7A5200;--wheat-soft:#FBF0D6;
  --red:#C2413B;--red-soft:#FBE9E7;--blue-soft:#E6EEF6;--blue-ink:#24527A;
  --r-lg:16px;--r-md:12px;--r-sm:9px;
  --font:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",system-ui,sans-serif;
  --nav-h:64px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--wheat);outline-offset:2px}
.num,.n{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;padding:0 0 calc(var(--nav-h) + 24px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;min-height:58px}
.topbar h1{font-size:18px;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{font-weight:700;font-size:15px;letter-spacing:.5px;color:var(--wheat);flex-shrink:0}
.back{background:rgba(255,255,255,.12);border:0;border-radius:10px;color:#fff;width:38px;height:38px;font-size:20px;display:grid;place-items:center}
.wrap{max-width:1120px;margin:0 auto;padding:16px}
.bnav{position:fixed;bottom:0;inset-inline:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
.bnav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--muted);font-weight:500}
.bnav button svg{width:22px;height:22px}
.bnav button.on{color:var(--pine)}
.bnav .fab span.ic{width:46px;height:46px;border-radius:15px;background:var(--wheat);color:var(--ink);display:grid;place-items:center;margin-top:-18px;box-shadow:0 6px 14px rgba(232,163,23,.35)}
.bnav .fab span.ic svg{width:24px;height:24px}
@media(min-width:960px){
  .side{display:flex;flex-direction:column;width:250px;background:var(--ink);color:#C9D3D0;position:sticky;top:0;height:100vh;padding:20px 14px;flex-shrink:0;overflow:auto}
  .side .logo{font-size:24px;font-weight:700;color:#fff;padding:4px 10px 2px}
  .side .logo b{color:var(--wheat)}
  .side .tagline{font-size:12px;color:#8FA19C;padding:0 10px 18px}
  .side button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:inherit;padding:10px 12px;border-radius:10px;text-align:right;font-size:14.5px}
  .side button svg{width:19px;height:19px;flex-shrink:0;opacity:.85}
  .side button:hover{background:rgba(255,255,255,.06)}
  .side button.on{background:rgba(232,163,23,.14);color:#fff}
  .side button.on svg{color:var(--wheat);opacity:1}
  .side .grp{font-size:11.5px;color:#7E908B;padding:16px 12px 4px}
  .side .newinv{margin-top:6px;background:var(--wheat);color:var(--ink);font-weight:600;justify-content:center}
  .side .newinv:hover{background:#F0B43A}
  .bnav{display:none}
  .main{padding-bottom:30px}
  .topbar{background:var(--bg);color:var(--ink);padding:22px 28px 6px;position:static}
  .topbar h1{font-size:24px;font-weight:700}
  .topbar .brand{display:none}
  .back{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
  .wrap{padding:14px 28px}
}

/* ---------- building blocks ---------- */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1}
.stack>*+*{margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card h2{font-size:16px;margin:0 0 12px;font-weight:600}
.card h2 small{font-weight:400;color:var(--muted);font-size:13px;margin-inline-start:6px}
.muted{color:var(--muted)}
.sm{font-size:13px}
.xs{font-size:12px}
.b{font-weight:600}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-size:21px;font-weight:700;margin-top:2px;direction:ltr;text-align:right}
.kpi.hot{background:var(--ink);border-color:var(--ink);color:#fff}
.kpi.hot .l{color:#AFC0BB}.kpi.hot .v{color:var(--wheat)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:11px;padding:10px 15px;font-weight:600;font-size:14.5px;background:var(--pine);color:#fff;min-height:42px;text-decoration:none}
.btn:hover{background:var(--pine-2)}
.btn svg{width:18px;height:18px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#F6F8F6}
.btn.gold{background:var(--wheat);color:var(--ink)}
.btn.gold:hover{background:#F0B43A}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{background:none;border:0;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--line-2);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}

.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.p-pending{background:var(--wheat-soft);color:var(--wheat-ink)}
.p-delivered{background:var(--pine-soft);color:var(--pine-2)}
.p-cancelled{background:#ECEFED;color:#77827D;text-decoration:line-through}
.p-received{background:var(--pine-soft);color:var(--pine-2)}
.p-debt{background:var(--red-soft);color:var(--red)}
.p-credit{background:var(--blue-soft);color:var(--blue-ink)}
.free-chip{display:inline-flex;align-items:center;gap:4px;background:var(--wheat-soft);color:var(--wheat-ink);border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:600}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;white-space:nowrap}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.search{position:relative;flex:1;min-width:200px}
.search input{width:100%;padding:11px 40px 11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.search svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line-2);background:none;border-inline:0;border-top:0;width:100%;text-align:right}
.li:last-child{border-bottom:0}
button.li:hover,.li.tap:hover{background:#F7F9F7}
.li .t{font-weight:600}
.li .s{font-size:12.5px;color:var(--muted)}
.li .end{margin-inline-start:auto;text-align:left;flex-shrink:0}
.li .amt{font-weight:700;direction:ltr}
.avatar{width:38px;height:38px;border-radius:11px;background:var(--pine-soft);color:var(--pine-2);display:grid;place-items:center;font-weight:700;flex-shrink:0}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:12px}

/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:#F7F9F7}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
table.t tfoot td{font-weight:700;border-top:1px solid var(--line);background:#F7F9F7}
table.t td.e,table.t th.e{text-align:left}

/* forms */
.fgrid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:620px){.fgrid{grid-template-columns:1fr 1fr}}
.fgrid .full{grid-column:1/-1}
.f label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;min-height:44px}
.f textarea{min-height:76px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--pine);box-shadow:0 0 0 3px rgba(14,107,92,.15)}
.f .hint{font-size:12px;color:var(--muted);margin-top:4px}
.f.bad input,.f.bad select{border-color:var(--red);box-shadow:0 0 0 3px rgba(194,65,59,.12)}
.check{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--pine)}

/* sheet (modal) */
.veil{position:fixed;inset:0;background:rgba(15,25,32,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
.veil.show{display:flex}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line-2)}
.sheet-h h3{margin:0;font-size:17px;flex:1}
.sheet-b{padding:16px;overflow:auto}
.sheet-f{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line-2);display:flex;gap:10px}
.sheet-f .btn{flex:1}
@media(min-width:700px){.veil{align-items:center}.sheet{border-radius:20px;max-height:86vh}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
#dlg{z-index:40}
#dlg .sheet{max-width:420px}

/* invoice editor */
.lines{display:flex;flex-direction:column;gap:10px}
.line{border:1px solid var(--line);border-radius:var(--r-md);padding:12px;background:#FBFCFB;position:relative}
.line .lgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.line .ltot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13.5px}
.line .rm{position:absolute;left:8px;top:8px}
.line .f label{font-size:12px}
.line .f input,.line .f select{min-height:42px;padding:9px 10px}
.totals{border-radius:var(--r-lg);background:var(--ink);color:#E9EFED;padding:16px}
.totals .r{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.totals .r .n{font-weight:600}
.totals .big{border-top:1px dashed rgba(255,255,255,.25);margin-top:8px;padding-top:10px;font-size:15px}
.totals .big .n{font-size:26px;font-weight:700;color:var(--wheat)}

/* documents (invoice/statement/print) */
.doc{background:#fff;color:#14212B;border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;max-width:760px;margin:0 auto}
.doc .dh{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:12px}
.doc .co{font-size:20px;font-weight:700}
.doc .co small{display:block;font-size:12.5px;font-weight:400;color:#5E6B66}
.doc .dt{text-align:left}
.doc .dt .k{font-size:18px;font-weight:700}
.doc .meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:13.5px;margin-bottom:12px}
.doc .sum{margin-top:10px;margin-inline-start:auto;width:min(300px,100%)}
.doc .sum .r{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #EEF1EC;font-size:14px}
.doc .sum .r.g{font-size:17px;font-weight:700;border-bottom:2px solid var(--ink)}
.doc .foot{margin-top:18px;font-size:12px;color:#5E6B66;text-align:center}
@media(max-width:560px){.doc{padding:14px}.doc table.t{font-size:13px}.doc table.t th,.doc table.t td{padding:7px 5px;white-space:normal}.doc .meta{grid-template-columns:1fr}.doc .co{font-size:17px}}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tri .f label{font-size:12px}.tri .f select{padding:9px 8px}
#printArea{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  body.printing>*:not(#printArea){display:none!important}
  body.printing #printArea{display:block}
  #printArea .doc{border:0;padding:0;max-width:none}
  #printArea .tbl-wrap{overflow:visible}
}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart .bar{fill:var(--pine)}
.chart .bar.today{fill:var(--wheat)}
.chart text{font-size:10px;fill:var(--muted);font-family:var(--font)}
.stockbar{height:8px;border-radius:99px;background:var(--line-2);overflow:hidden;margin-top:6px}
.stockbar b{display:block;height:100%;background:var(--pine);border-radius:99px}
.stockbar.low b{background:var(--red)}

.banner{background:var(--red-soft);color:#7E2420;border:1px solid #F1C9C5;border-radius:var(--r-md);padding:12px 14px;font-size:14px;margin-bottom:14px}
.info{background:var(--wheat-soft);color:#5C4100;border-radius:var(--r-md);padding:11px 14px;font-size:13.5px}
.toast{position:fixed;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;z-index:50;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:none;max-width:90vw;text-align:center}
@media(min-width:960px){.toast{bottom:24px}}
.more-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.more-grid{grid-template-columns:repeat(3,1fr)}}
.more-grid button{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:right;font-weight:600}
.more-grid button svg{width:24px;height:24px;color:var(--pine)}
.more-grid button span{font-weight:400;font-size:12.5px;color:var(--muted)}
.ledger td.neg{color:var(--blue-ink)}
hr.sep{border:0;border-top:1px solid var(--line-2);margin:14px 0}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="wrap" id="view"></main>
  </div>
</div>
<nav class="bnav" id="bnav"></nav>
<div class="veil" id="sheet"><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-h"><h3 id="sheetTitle"></h3><button type="button" class="icon-btn" data-act="closeSheet" aria-label="إغلاق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="sheet-b" id="sheetBody"></div><div class="sheet-f" id="sheetFoot"></div></div></div>
<div class="veil" id="dlg"><div class="sheet" role="alertdialog" aria-modal="true"><div class="sheet-b"><p id="dlgText" style="margin:4px 0 12px;line-height:1.9;white-space:pre-line"></p><div class="f" id="dlgInputWrap" style="display:none"><input id="dlgInput" autocomplete="off"></div></div><div class="sheet-f"><button type="button" class="btn" id="dlgOk">تأكيد</button><button type="button" class="btn ghost" id="dlgCancel">إلغاء</button></div></div></div>
<div class="toast" id="toast" role="status"></div>
<div id="printArea"></div>
<script>
'use strict';
/* =========================================================
   BILBOX v2 — نظام إدارة التوزيع
   ملف واحد يعمل بدون خادم. البيانات في localStorage على هذا الجهاز.
   ========================================================= */
const KEY='bilbox_v2',OLDKEY='bilbox_complete_v1';
let storageOK=true;try{localStorage.setItem('__bx','1');localStorage.removeItem('__bx')}catch(e){storageOK=false}

/* ---------- utils ---------- */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=x=>String(x).padStart(2,'0');
const isoDate=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>isoDate(new Date());
const n=v=>{let x=Number(v);return Number.isFinite(x)?x:0};
const r2=v=>Math.round((n(v)+Number.EPSILON)*100)/100;
const fmt=v=>{let x=r2(v);return (x<0?'-':'')+'$'+Math.abs(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})};
const fmt0=v=>{let x=Math.round(n(v));return (x<0?'-':'')+'$'+Math.abs(x).toLocaleString('en-US')};
const num=v=>n(v).toLocaleString('en-US',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M=v=>`<span class="n">${fmt(v)}</span>`;
const N=v=>`<span class="n">${num(v)}</span>`;
const monthsAr=['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
const dateAr=s=>{if(!s)return'';let[y,m,d]=s.split('-');return `${+d} ${monthsAr[+m-1]} ${y}`};
const initials=s=>String(s||'?').trim().slice(0,1);

/* ---------- icons ---------- */
const I={
home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/>',
box:'<path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5l9 4.5 9-4.5M12 12v9"/>',
more:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
ship:'<path d="M3 17l2 3h14l2-3"/><path d="M5 17V9h14v8"/><path d="M9 9V5h6v4"/>',
cash:'<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/>',
ret:'<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',
wallet:'<path d="M4 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h11"/><circle cx="16" cy="13.5" r="1.3"/>',
truck:'<path d="M2 6h11v10H2zM13 10h4l4 4v2h-8z"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',

  if(!d.products.length)d.products=defaults().products;
  d.customers=(o.customers||[]).map(c=>({id:c.id||uid(),name:c.name||'زبون',type:c.type==='wholesale'?'wholesale':'retail',area:c.area||'',phone:c.phone||'',address:c.address||'',repId:'',opening:0,notes:''}));

  const roleMap={'مندوب':'rep','سائق':'driver','سيارة':'vehicle','إدارة':'admin'};

  d.purchases=(o.purchases||[]).map(p=>{let q=n(p.qty);return{id:p.id||uid(),no:'PUR-'+pad4(seq.pur++),date:p.date||today(),supplierId:p.supplierId||'',status:p.status==='received'?'received':'pending',lines:[{productId:p.productId,qty:q,unitCost:q?r2(n(p.cost)/q):0}],freight:n(p.freight),customs:n(p.customs),customsVat:0,other:n(p.other),notes:p.notes||''}});
  let orderCust={};
  d.invoices=(o.orders||[]).map(x=>{orderCust[x.id]=x.customerId;let st=x.status==='delivered'?'delivered':'pending';return{id:x.id||uid(),no:'INV-'+pad4(seq.inv++),date:x.date||today(),customerId:x.customerId,repId:x.repId||'',driverId:x.driverId||'',vehicleId:x.vehicleId||'',status:st,vat:n(x.vat),lines:[{productId:x.productId,qty:n(x.qty),free:n(x.free),price:n(x.price),cost:null}],notes:x.notes||'',deliveredAt:st==='delivered'?(x.date||today()):''}});
  d.payments=(o.payments||[]).map(p=>({id:p.id||uid(),no:'RC-'+pad4(seq.pay++),date:p.date||today(),customerId:orderCust[p.orderId]||'',invoiceId:p.orderId||'',amount:n(p.amount),method:METHODS[p.method]?p.method:'cash',repId:'',notes:p.notes||''})).filter(p=>p.customerId);

  db=d;
  for(const inv of d.invoices)if(inv.status==='delivered')for(const l of inv.lines)if(l.cost==null)l.cost=r2(avgCost(l.productId));

  return d;
}
function pad4(x){return String(x).padStart(4,'0')}
function normalize(d){
  let base=defaults();
  if(!d||typeof d!=='object')return base;
  for(const k of ['products','customers','suppliers','team','purchases','invoices','returns','payments','expenses','adjustments'])if(!Array.isArray(d[k]))d[k]=[];
  d.settings=Object.assign(base.settings,d.settings||{});
  d.settings.seq=Object.assign({inv:1,ret:1,pur:1,pay:1},d.settings.seq||{});
  d.v=2;return d;
}

/* ---------- lookups ---------- */
const byId=(list,id)=>list.find(x=>x.id===id);
const P=id=>byId(db.products,id),C=id=>byId(db.customers,id),T=id=>byId(db.team,id),S=id=>byId(db.suppliers,id),INV=id=>byId(db.invoices,id);
const pName=id=>P(id)?.name||'منتج محذوف',cName=id=>C(id)?.name||'زبون محذوف',tName=id=>T(id)?.name||'—';

function nextNo(kind){let pre={inv:'INV-',ret:'RET-',pur:'PUR-',pay:'RC-'}[kind];let x=db.settings.seq[kind]++;return pre+pad4(x)}

/* ---------- costing & stock ---------- */
function landedLines(pu){
  let value=pu.lines.reduce((a,l)=>a+n(l.qty)*n(l.unitCost),0),qty=pu.lines.reduce((a,l)=>a+n(l.qty),0);
  let extra=n(pu.freight)+n(pu.customs)+n(pu.other);
  return pu.lines.map(l=>{let v=n(l.qty)*n(l.unitCost);let share=value>0?v/value:(qty>0?n(l.qty)/qty:0);let total=v+extra*share;return{productId:l.productId,qty:n(l.qty),value:total,unit:n(l.qty)?total/n(l.qty):0}});
}
function purchaseTotal(pu){return pu.lines.reduce((a,l)=>a+n(l.qty)*n(l.unitCost),0)+n(pu.freight)+n(pu.customs)+n(pu.other)}
function avgCost(pid){
  let p=P(pid);if(!p)return 0;
  let q=n(p.opening),v=n(p.opening)*n(p.cost);
  for(const pu of db.purchases)if(pu.status==='received')for(const l of landedLines(pu))if(l.productId===pid){q+=l.qty;v+=l.value}
  return q>0?v/q:n(p.cost);
}
function moves(pid){
  let p=P(pid),r={opening:n(p?.opening),received:0,sold:0,returned:0,adjusted:0,reserved:0};
  for(const pu of db.purchases)if(pu.status==='received')for(const l of pu.lines)if(l.productId===pid)r.received+=n(l.qty);
  for(const i of db.invoices){if(i.status==='cancelled')continue;for(const l of i.lines)if(l.productId===pid){let q=n(l.qty)+n(l.free);if(i.status==='delivered')r.sold+=q;else r.reserved+=q}}
  for(const rt of db.returns)for(const l of rt.lines)if(l.productId===pid)r.returned+=n(l.qty)+n(l.free);
  for(const a of db.adjustments)if(a.productId===pid)r.adjusted+=n(a.qty);
  r.stock=r.opening+r.received-r.sold+r.returned+r.adjusted;r.available=r.stock-r.reserved;return r;
}
const stockOf=pid=>moves(pid).stock,availOf=pid=>moves(pid).available;

/* ---------- money ---------- */
const linesNet=lines=>lines.reduce((a,l)=>a+n(l.qty)*n(l.price),0);
const invNet=i=>r2(linesNet(i.lines)),invVat=i=>r2(invNet(i)*n(i.vat)/100),invGross=i=>r2(invNet(i)+invVat(i));
const retNet=r=>r2(linesNet(r.lines)),retVat=r=>r2(retNet(r)*n(r.vat)/100),retGross=r=>r2(retNet(r)+retVat(r));
const invCartons=i=>i.lines.reduce((a,l)=>a+n(l.qty)+n(l.free),0);
function custBalance(cid){
  let c=C(cid),b=n(c?.opening);
  for(const i of db.invoices)if(i.customerId===cid&&i.status==='delivered')b+=invGross(i);
  for(const r of db.returns)if(r.customerId===cid)b-=retGross(r);
  for(const p of db.payments)if(p.customerId===cid)b-=n(p.amount);
  return r2(b);
}
const totalReceivable=()=>r2(db.customers.reduce((a,c)=>a+Math.max(0,custBalance(c.id)),0));
function invPaid(inv){return r2(db.payments.filter(p=>p.invoiceId===inv.id).reduce((a,p)=>a+n(p.amount),0))}
function returnedQty(inv,pid){let q=0,f=0;for(const r of db.returns)if(r.invoiceId===inv.id)for(const l of r.lines)if(l.productId===pid){q+=n(l.qty);f+=n(l.free)}return{q,f}}

/* ---------- pricing rules ---------- */
function priceFor(p,c){if(!p)return 0;return c?.type==='wholesale'?n(p.priceWholesale):n(p.priceRetail)}
function promoFree(p,c,qty){if(!p||!c||n(p.promoEvery)<=0)return 0;if(c.type==='wholesale'&&!p.promoWholesale)return 0;return Math.floor(n(qty)/n(p.promoEvery))}

/* ---------- period helpers ---------- */
const inRange=(d,a,b)=>(!a||d>=a)&&(!b||d<=b);
function periodSummary(a,b){
  let net=0,vat=0,cogs=0,cartons=0,free=0,retNetT=0,retVatT=0,retCost=0,exp=0,inVat=0;
  const byP={},byC={},byR={};
  for(const i of db.invoices){if(i.status!=='delivered'||!inRange(i.deliveredAt||i.date,a,b))continue;
    let iv=n(i.vat);
    for(const l of i.lines){let ln=n(l.qty)*n(l.price),lc=(n(l.qty)+n(l.free))*n(l.cost);net+=ln;vat+=ln*iv/100;cogs+=lc;cartons+=n(l.qty)+n(l.free);free+=n(l.free);
      let bp=byP[l.productId]||(byP[l.productId]={qty:0,free:0,net:0,cogs:0});bp.qty+=n(l.qty);bp.free+=n(l.free);bp.net+=ln;bp.cogs+=lc}
    let bc=byC[i.customerId]||(byC[i.customerId]={net:0,count:0});bc.net+=invNet(i);bc.count++;
    let k=i.repId||'-';let br=byR[k]||(byR[k]={net:0,count:0,cartons:0});br.net+=invNet(i);br.count++;br.cartons+=invCartons(i)}
  for(const r of db.returns){if(!inRange(r.date,a,b))continue;let rn=retNet(r);retNetT+=rn;retVatT+=retVat(r);
    for(const l of r.lines){let lc=(n(l.qty)+n(l.free))*n(l.cost);retCost+=lc;let bp=byP[l.productId]||(byP[l.productId]={qty:0,free:0,net:0,cogs:0});bp.qty-=n(l.qty);bp.free-=n(l.free);bp.net-=n(l.qty)*n(l.price);bp.cogs-=lc}
    let bc=byC[r.customerId]||(byC[r.customerId]={net:0,count:0});bc.net-=rn}
  for(const e of db.expenses)if(inRange(e.date,a,b))exp+=n(e.amount);
  for(const pu of db.purchases)if(pu.status==='received'&&inRange(pu.date,a,b))inVat+=n(pu.customsVat);
  let sales=net-retNetT,cost=cogs-retCost,gross=sales-cost;
  return{sales,cost,gross,exp,netProfit:gross-exp,margin:sales?gross/sales*100:0,outVat:vat-retVatT,inVat,cartons,free,byP,byC,byR,returns:retNetT};
}

/* ---------- dashboard ---------- */
V.dashboard=()=>{
  let t=today(),mStart=t.slice(0,8)+'01';
  let day=periodSummary(t,t),mon=periodSummary(mStart,t);
  let stockValue=db.products.reduce((a,p)=>a+Math.max(0,stockOf(p.id))*avgCost(p.id),0);
  // 14-day chart
  let days=[];for(let k=13;k>=0;k--){let d=new Date();d.setDate(d.getDate()-k);days.push(isoDate(d))}
  let vals=days.map(d=>db.invoices.filter(i=>i.status==='delivered'&&(i.deliveredAt||i.date)===d).reduce((a,i)=>a+invNet(i),0));
  let mx=Math.max(1,...vals),W=700,H=170,bw=W/14;
  let bars=vals.map((v,k)=>{let h=Math.max(v>0?3:0,(v/mx)*(H-40));let x=W-(k+1)*bw+6;return `<rect class="bar${k===13?' today':''}" x="${x}" y="${H-22-h}" width="${bw-12}" height="${h}" rx="4"><title>${days[k]}: ${fmt(v)}</title></rect><text x="${x+(bw-12)/2}" y="${H-6}" text-anchor="middle">${+days[k].slice(8)}</text>`}).join('');
  let chart=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="مبيعات آخر 14 يوماً">${bars}</svg>`;
  let debtors=db.customers.map(c=>({c,b:custBalance(c.id)})).filter(x=>x.b>0.004).sort((a,b)=>b.b-a.b).slice(0,5);
  let pending=db.invoices.filter(i=>i.status==='pending');
  let recent=db.invoices.slice().sort((a,b)=>(b.date+b.no).localeCompare(a.date+a.no)).slice(0,6);
  let stockRows=db.products.filter(p=>p.active!==false).map(p=>{let m=moves(p.id);let low=m.available<=n(p.reorder);let pct=Math.max(3,Math.min(100,n(p.reorder)>0?m.available/(n(p.reorder)*2)*100:100));return `<div style="padding:8px 0;border-bottom:1px solid var(--line-2)"><div class="row between"><span class="b">${esc(p.name)}</span><span class="sm ${low?'b':''}" style="color:${low?'var(--red)':'inherit'}">${N(m.available)} ${esc(p.unit)} متاح</span></div><div class="stockbar${low?' low':''}"><b style="width:${pct}%"></b></div>${low?`<div class="xs" style="color:var(--red);margin-top:3px">تحت حد إعادة الطلب (${N(p.reorder)})</div>`:''}</div>`}).join('');
  let html=`<div class="stack">
  <div class="row between"><div><div class="muted sm">${dateAr(t)}</div><div class="b" style="font-size:18px">${pending.length?`لديك ${N(pending.length)} ${pending.length===1?'فاتورة':'فواتير'} قيد التجهيز`:'لا توجد فواتير بانتظار التسليم'}</div></div><div class="row"><button type="button" class="btn gold" data-act="newInvoice">${ic('plus')} فاتورة</button><button type="button" class="btn ghost" data-act="newPayment">${ic('cash')} قبض</button></div></div>
  <div class="kpis">
   <div class="kpi hot"><div class="l">مبيعات اليوم</div><div class="v">${fmt0(day.sales)}</div></div>
   <div class="kpi"><div class="l">مبيعات الشهر</div><div class="v">${fmt0(mon.sales)}</div></div>
   <div class="kpi"><div class="l">الربح الإجمالي للشهر</div><div class="v">${fmt0(mon.gross)}</div></div>
   <div class="kpi"><div class="l">ديون الزبائن</div><div class="v">${fmt0(totalReceivable())}</div></div>
   <div class="kpi"><div class="l">قيمة المخزون بالكلفة</div><div class="v">${fmt0(stockValue)}</div></div>
  </div>
  <div class="card"><h2>المبيعات المسلّمة<small>آخر 14 يوماً، قبل الضريبة</small></h2>${chart}</div>
  <div class="grid2">
   <div class="card"><h2>المخزون المتاح</h2>${stockRows||'<div class="empty">أضف منتجاً</div>'}</div>
   <div class="card"><h2>أكبر الديون</h2>${debtors.length?`<div class="list" style="border:0">${debtors.map(x=>`<button type="button" class="li" data-act="openCustomer" data-id="${x.c.id}"><span class="avatar">${esc(initials(x.c.name))}</span><span><span class="t">${esc(x.c.name)}</span><br><span class="s">${esc(x.c.area||CTYPES[x.c.type])}</span></span><span class="end amt" style="color:var(--red)">${fmt(x.b)}</span></button>`).join('')}</div>`:'<div class="empty">لا ديون على الزبائن</div>'}</div>
  </div>
  <div class="card"><div class="row between" style="margin-bottom:8px"><h2 style="margin:0">آخر الفواتير</h2><button type="button" class="btn ghost sm" data-act="nav" data-page="invoices">كل الفواتير</button></div>${recent.length?`<div class="list" style="border:0">${recent.map(invRow).join('')}</div>`:`<div class="empty">لم تُسجَّل أي فاتورة بعد.<br><button type="button" class="btn gold" data-act="newInvoice">${ic('plus')} أنشئ أول فاتورة</button></div>`}</div>
  </div>`;
  return{title:'لوحة اليوم',html};
};
function invRow(i){let g=invGross(i);return `<button type="button" class="li" data-act="openInvoice" data-id="${i.id}"><span class="avatar" style="background:${i.status==='pending'?'var(--wheat-soft)':i.status==='cancelled'?'#ECEFED':'var(--pine-soft)'};color:${i.status==='pending'?'var(--wheat-ink)':'var(--pine-2)'}">${ic('receipt')}</span><span style="min-width:0"><span class="t">${esc(cName(i.customerId))}</span><br><span class="s"><span class="n">${esc(i.no)}</span> · ${dateAr(i.date)} · ${N(invCartons(i))} وحدة</span></span><span class="end"><span class="amt">${fmt(g)}</span><br>${statusPill(i.status)}</span></button>`}

/* ---------- invoice editor ---------- */
function startInvoice(customerId='',editId=null){
  if(!db.customers.length){ask('أضف زبوناً أولاً حتى تتمكن من إنشاء فاتورة.',{ok:'إضافة زبون'}).then(ok=>ok&&customerForm());return}
  if(editId){let i=INV(editId);draft={kind:'inv',editId,customerId:i.customerId,date:i.date,repId:i.repId,driverId:i.driverId,vehicleId:i.vehicleId,notes:i.notes,lines:i.lines.map(l=>({...l,auto:promoFree(P(l.productId),C(i.customerId),l.qty)===n(l.free)})),deliverNow:false,cashNow:false}}
  else{let c=C(customerId);let zar=db.products.find(p=>p.active!==false&&n(p.priceRetail)>0)||db.products[0];draft={kind:'inv',editId:null,customerId:customerId||'',date:today(),repId:c?.repId||'',driverId:'',vehicleId:'',notes:'',lines:[newLine(zar?.id,c)],deliverNow:false,cashNow:false}}
  go('invoiceEdit');
}
function newLine(pid,c){let p=P(pid);return{productId:pid||'',qty:1,free:promoFree(p,c,1),price:priceFor(p,c),auto:true}}
function draftTotals(){let o={vat:db.settings.vat,lines:draft.lines};return{net:invNet(o),vat:invVat(o),gross:invGross(o),cartons:draft.lines.reduce((a,l)=>a+n(l.qty)+n(l.free),0),free:draft.lines.reduce((a,l)=>a+n(l.free),0)}}
V.invoiceEdit=()=>{
  if(!draft||draft.kind!=='inv')return V.invoices();
  let c=C(draft.customerId);
  let prodOpts=db.products.filter(p=>p.active!==false||draft.lines.some(l=>l.productId===p.id)).map(p=>[p.id,p.name]);
  let lines=draft.lines.map((l,k)=>{let p=P(l.productId);
   return `<div class="line"><button type="button" class="icon-btn rm" data-act="rmLine" data-k="${k}" aria-label="حذف السطر">${ic('trash')}</button><div class="f" style="margin-inline-end:40px"><label>الصنف</label><select data-line="${k}" data-key="productId">${prodOpts.map(([v,t])=>`<option value="${v}"${v===l.productId?' selected':''}>${esc(t)}</option>`).join('')}</select></div>
   <div class="lgrid"><div class="f"><label>الكمية</label><input type="number" inputmode="numeric" min="1" step="1" value="${esc(l.qty)}" data-line="${k}" data-key="qty"></div><div class="f"><label>السعر $</label><input type="number" inputmode="decimal" min="0" step="0.01" value="${esc(l.price)}" data-line="${k}" data-key="price"></div><div class="f"><label>مجاناً</label><input type="number" inputmode="numeric" min="0" step="1" value="${esc(l.free)}" data-line="${k}" data-key="free"></div></div>
   <div class="ltot"><span class="muted xs">${p?esc(p.pack||p.unit):''}${p&&n(p.promoEvery)>0?` · عرض: ${num(p.promoEvery)} + 1`:''}</span><b id="lt_${k}">${M(n(l.qty)*n(l.price))}</b></div><div id="lw_${k}">${lineWarn(l,c)}</div></div>`}).join('');
  let t=draftTotals();
  let html=`<div class="grid2" style="align-items:start"><div class="stack">
   <div class="card"><div class="fgrid">
    ${sel('الزبون','customerId',[['','اختر الزبون'],...db.customers.map(x=>[x.id,x.name+' — '+(x.area||CTYPES[x.type])])],draft.customerId,{full:true,attrs:'data-draft="customerId"'})}

   </div><div class="tri" style="margin-top:12px;${drivers().length?'':'grid-template-columns:repeat(2,minmax(0,1fr))'}">${sel('المندوب','repId',optsOf(reps(),'—'),draft.repId,{attrs:'data-draft="repId"'})}${drivers().length?sel('السائق','driverId',optsOf(drivers(),'—'),draft.driverId,{attrs:'data-draft="driverId"'}):''}${sel('السيارة','vehicleId',optsOf(vehicles(),'—'),draft.vehicleId,{attrs:'data-draft="vehicleId"'})}</div><div class="row between" style="margin-top:10px"><span class="sm muted">${c?`${esc(CTYPES[c.type])} · الرصيد الحالي ${balPill(custBalance(c.id))}`:''}</span><button type="button" class="btn ghost sm" data-act="customerForm">${ic('plus')} زبون جديد</button></div></div>
   <div class="card"><div class="row between" style="margin-bottom:10px"><h2 style="margin:0">الأصناف</h2><button type="button" class="btn ghost sm" data-act="addLine">${ic('plus')} إضافة صنف</button></div><div class="lines">${lines||'<div class="empty">أضف صنفاً</div>'}</div></div>
   <div class="card">${area('ملاحظات','notes',draft.notes).replace('name="notes"','name="notes" data-draft="notes"')}</div>

   ${draft.editId?'':`<div class="card stack" style="padding:12px">${chk('تسليم الفاتورة الآن','deliverNow',draft.deliverNow).replace('name="deliverNow"','name="deliverNow" data-draft="deliverNow"')}${chk('قبض المبلغ كاملاً نقداً الآن','cashNow',draft.cashNow).replace('name="cashNow"','name="cashNow" data-draft="cashNow"')}</div>`}

function lineWarn(l,c){let p=P(l.productId);if(!p)return'';let av=availOf(p.id)+(draft.editId?reservedIn(draft.editId,p.id):0),w='';if(n(l.qty)+n(l.free)>av)w+=`<div class="xs" style="color:var(--red)">المتاح ${num(av)} فقط</div>`;if(c?.type==='wholesale'&&n(p.minWholesale)>0&&n(l.qty)<n(p.minWholesale))w+=`<div class="xs" style="color:var(--red)">الحد الأدنى للجملة ${num(p.minWholesale)}</div>`;return w}
function draftTotalsHtml(t){return `<div class="r"><span>عدد الوحدات</span><span class="n">${num(t.cartons)}</span></div>${t.free?`<div class="r"><span>منها مجاناً</span><span class="n" style="color:var(--wheat)">${num(t.free)}</span></div>`:''}<div class="r"><span>قبل الضريبة</span>${M(t.net)}</div><div class="r"><span>ضريبة ${num(db.settings.vat)}%</span>${M(t.vat)}</div><div class="r big"><span>الإجمالي</span>${M(t.gross)}</div>`}
function reservedIn(invId,pid){let i=INV(invId);if(!i||i.status!=='pending')return 0;return i.lines.filter(l=>l.productId===pid).reduce((a,l)=>a+n(l.qty)+n(l.free),0)}
function onLineChange(k,key,val,el){
  let l=draft.lines[k];if(!l)return;let c=C(draft.customerId);
  if(key==='productId'){l.productId=val;let p=P(val);l.price=priceFor(p,c);l.free=promoFree(p,c,l.qty);l.auto=true;render();return}
  if(key==='qty'){l.qty=val;if(l.auto){l.free=promoFree(P(l.productId),c,val);let fi=$(`[data-line="${k}"][data-key="free"]`);if(fi&&fi!==document.activeElement)fi.value=l.free}}
  if(key==='price')l.price=val;

async function saveInvoice(){
  let c=C(draft.customerId);

  let lines=draft.lines.filter(l=>l.productId);
  if(!lines.length)return msg('أضف صنفاً واحداً على الأقل.');
  for(const l of lines){let p=P(l.productId);
    if(!Number.isInteger(n(l.qty))||n(l.qty)<1)return msg(`${p.name}: الكمية يجب أن تكون رقماً صحيحاً 1 أو أكثر.`);
    if(!Number.isInteger(n(l.free))||n(l.free)<0)return msg(`${p.name}: الكمية المجانية غير صحيحة.`);
    if(n(l.price)<=0)return msg(`${p.name}: أدخل سعر البيع. يمكنك ضبط الأسعار من صفحة المنتجات.`);
    if(c.type==='wholesale'&&n(p.minWholesale)>0&&n(l.qty)<n(p.minWholesale))return msg(`${p.name}: الحد الأدنى لتاجر الجملة ${num(p.minWholesale)} ${p.unit}.`);
    let exp=promoFree(p,c,l.qty);if(n(p.promoEvery)>0&&n(l.free)>exp&&!(await ask(`${p.name}: الكمية المجانية (${num(l.free)}) أكثر من العرض المعتاد (${num(exp)}). هل تريد المتابعة؟`)))return}
  // stock per product
  let need={};for(const l of lines)need[l.productId]=(need[l.productId]||0)+n(l.qty)+n(l.free);
  for(const pid in need){let av=availOf(pid)+(draft.editId?reservedIn(draft.editId,pid):0);if(need[pid]>av)return msg(`${pName(pid)}: المطلوب ${num(need[pid])} والمتاح ${num(av)}. سجّل استلام بضاعة أو خفّض الكمية.`)}
  let clean=lines.map(l=>({productId:l.productId,qty:n(l.qty),free:n(l.free),price:r2(l.price),cost:null}));
  let inv;
  if(draft.editId){inv=INV(draft.editId);Object.assign(inv,{customerId:c.id,date:draft.date||today(),repId:draft.repId,driverId:draft.driverId,vehicleId:draft.vehicleId,notes:draft.notes,lines:clean})}
  else{inv={id:uid(),no:nextNo('inv'),date:draft.date||today(),customerId:c.id,repId:draft.repId,driverId:draft.driverId,vehicleId:draft.vehicleId,status:'pending',vat:n(db.settings.vat),lines:clean,notes:draft.notes,deliveredAt:''};db.invoices.push(inv)}
  let t='تم حفظ الفاتورة '+inv.no;
  if(!draft.editId&&(draft.deliverNow||draft.cashNow)){doDeliver(inv);t='تم حفظ الفاتورة وتسليمها';
    if(draft.cashNow){db.payments.push({id:uid(),no:nextNo('pay'),date:inv.date,customerId:c.id,invoiceId:inv.id,amount:invGross(inv),method:'cash',repId:inv.repId,notes:'قبض عند التسليم'});t='تم الحفظ والتسليم وقبض '+fmt(invGross(inv))}}
  draft=null;save();hist=hist.filter(h=>h.page!=='invoiceEdit');route={page:'invoice',arg:inv.id};render();window.scrollTo(0,0);toast(t);
}

/* ---------- inventory ---------- */
V.inventory=()=>{
  let rows=db.products.map(p=>{let m=moves(p.id),ac=avgCost(p.id);return `<tr><td class="b">${esc(p.name)}<div class="xs muted">${esc(p.unit)}</div></td><td>${N(m.opening)}</td><td>${N(m.received)}</td><td>${N(m.sold)}</td><td>${N(m.returned)}</td><td>${N(m.adjusted)}</td><td class="b">${N(m.stock)}</td><td>${N(m.reserved)}</td><td class="b" style="color:${m.available<=n(p.reorder)?'var(--red)':'var(--pine)'}">${N(m.available)}</td><td>${M(ac)}</td><td class="e">${M(Math.max(0,m.stock)*ac)}</td></tr>`}).join('');

  return{title:'المخزون',html:`<div class="stack">${db.products.every(p=>stockOf(p.id)<=0)?`<div class="info"><b>المخزون فارغ.</b> لإدخال بضاعة وصلت بشحنة اضغط «إدخال شحنة». ولإدخال بضاعة موجودة أصلاً في المستودع اضغط «مخزون البداية».</div>`:''}<div class="row"><button type="button" class="btn gold" data-act="newPurchase">${ic('ship')} إدخال شحنة</button><button type="button" class="btn ghost" data-act="openingForm">${ic('box')} مخزون البداية</button><button type="button" class="btn ghost" data-act="adjustForm">${ic('adjust')} تسوية مخزون</button></div><div class="sm muted">المتاح = الرصيد − المحجوز في فواتير قيد التجهيز.</div>
  <div class="card" style="padding:0"><div class="tbl-wrap"><table class="t"><thead><tr><th>المنتج</th><th>البداية</th><th>المستلم</th><th>المسلّم</th><th>المرتجع</th><th>التسويات</th><th>الرصيد</th><th>المحجوز</th><th>المتاح</th><th>متوسط الكلفة</th><th class="e">القيمة</th></tr></thead><tbody>${rows}</tbody></table></div></div>
  <div class="card"><h2>آخر التسويات<small>تالف، جرد، عينات</small></h2>${adj.length?`<div class="list" style="border:0">${adj.map(a=>`<div class="li"><span class="avatar">${ic('adjust')}</span><span><span class="t">${esc(pName(a.productId))}</span><br><span class="s">${dateAr(a.date)} · ${esc(a.reason)}${a.notes?' · '+esc(a.notes):''}</span></span><span class="end"><span class="amt" style="color:${a.qty<0?'var(--red)':'var(--pine)'}">${a.qty>0?'+':''}${num(a.qty)}</span><br><button type="button" class="btn danger sm" data-act="delAdjust" data-id="${a.id}">حذف</button></span></div>`).join('')}</div>`:'<div class="empty">لا تسويات.</div>'}</div></div>`};
};
function openingForm(){
  openSheet('مخزون البداية',`<div class="stack"><div class="info">أدخل الكمية الموجودة فعلاً في المستودع الآن، وكلفة الوحدة الواصلة. هذه الكمية تُستعمل كنقطة بداية للحساب.</div>${db.products.map(p=>`<div class="line"><div class="b">${esc(p.name)} <span class="xs muted">(${esc(p.unit)})</span></div><div class="lgrid" style="grid-template-columns:1fr 1fr"><div class="f"><label>الكمية</label><input type="number" inputmode="numeric" min="0" step="1" name="o_${p.id}" value="${n(p.opening)}"></div><div class="f"><label>كلفة الوحدة $</label><input type="number" inputmode="decimal" min="0" step="0.01" name="c_${p.id}" value="${n(p.cost)}"></div></div></div>`).join('')}</div>`,{save:()=>{
    let b=$('#sheetBody');if(!validate(b))return;let f=readForm(b);
    for(const p of db.products){let q=n(f['o_'+p.id]);if(!Number.isInteger(q)||q<0)return msg(p.name+': الكمية يجب أن تكون رقماً صحيحاً.')}
    for(const p of db.products){p.opening=n(f['o_'+p.id]);p.cost=r2(f['c_'+p.id])}
    closeSheet();commit('تم حفظ مخزون البداية')}});
}
function adjustForm(){
  openSheet('تسوية مخزون',`<div class="fgrid">${sel('المنتج','productId',db.products.map(p=>[p.id,p.name+' — رصيد '+num(stockOf(p.id))]),'',{full:true})}${sel('النوع','dir',[['-1','نقص (تالف، عينة، فرق جرد)'],['1','زيادة (فرق جرد)']])}${fld('الكمية','qty','',{type:'number',req:true,attrs:'min="1" step="1"'})}${fld('التاريخ','date',today(),{type:'date',req:true})}${sel('السبب','reason',ADJREASONS.map(x=>[x,x]))}${area('ملاحظات','notes','')}</div>`,{save:()=>{
    let b=$('#sheetBody');if(!validate(b))return;let f=readForm(b);let q=n(f.qty)*n(f.dir);if(!Number.isInteger(q)||q===0)return msg('أدخل كمية صحيحة.');
    if(q<0&&availOf(f.productId)+q<0)return msg('الكمية أكبر من المتاح في المخزون.');
    db.adjustments.push({id:uid(),date:f.date,productId:f.productId,qty:q,reason:f.reason,notes:f.notes.trim()});closeSheet();commit('تم تسجيل التسوية')}});
}

/* ---------- purchases ---------- */
V.purchases=()=>{
  let list=db.purchases.slice().sort((a,b)=>(b.date+b.no).localeCompare(a.date+a.no));
  return{title:'المشتريات والشحنات',html:`<div class="stack"><div class="row between"><div class="sm muted">الشحن والجمارك والمصاريف تُوزّع على الأصناف حسب القيمة لحساب الكلفة الواصلة.</div><button type="button" class="btn" data-act="newPurchase">${ic('plus')} شحنة جديدة</button></div>
  ${list.length?`<div class="list">${list.map(pu=>{let ll=landedLines(pu);return `<button type="button" class="li" data-act="editPurchase" data-id="${pu.id}"><span class="avatar">${ic('ship')}</span><span style="min-width:0"><span class="t">${pu.lines.map(l=>esc(pName(l.productId))).join('، ')}</span><br><span class="s"><span class="n">${esc(pu.no)}</span> · ${dateAr(pu.date)} · ${esc(S(pu.supplierId)?.name||'')} · ${ll.map(l=>num(l.qty)+' بكلفة '+fmt(l.unit)).join('، ')}</span></span><span class="end"><span class="amt">${fmt(purchaseTotal(pu))}</span><br>${statusPill(pu.status==='received'?'received':'pending').replace('قيد التجهيز','قيد الشحن')}</span></button>`}).join('')}</div>`:'<div class="card empty">لم تُسجَّل أي شحنة.<br><button type="button" class="btn" data-act="newPurchase">سجّل أول شحنة</button></div>'}</div>`};
};
function startPurchase(id){
  if(id){let pu=byId(db.purchases,id);draft={kind:'pur',editId:id,supplierId:pu.supplierId,date:pu.date,status:pu.status,lines:pu.lines.map(l=>({...l})),freight:pu.freight,customs:pu.customs,customsVat:pu.customsVat||0,other:pu.other,notes:pu.notes}}
  else draft={kind:'pur',editId:null,supplierId:'',date:today(),status:'pending',lines:[{productId:db.products[0]?.id||'',qty:'',unitCost:''}],freight:0,customs:0,customsVat:0,other:0,notes:''};
  go('purchaseEdit');
}
V.purchaseEdit=()=>{
  if(!draft||draft.kind!=='pur')return V.purchases();
  let locked=draft.editId&&byId(db.purchases,draft.editId)?.status==='received';
  let tmp={lines:draft.lines,freight:draft.freight,customs:draft.customs,other:draft.other};
  let ll=landedLines(tmp),tot=purchaseTotal(tmp);
  let lines=draft.lines.map((l,k)=>`<div class="line">${locked?'':`<button type="button" class="icon-btn rm" data-act="rmPLine" data-k="${k}" aria-label="حذف">${ic('trash')}</button>`}<div class="f" style="margin-inline-end:40px"><label>الصنف</label><select data-pline="${k}" data-key="productId" ${locked?'disabled':''}>${db.products.map(p=>`<option value="${p.id}"${p.id===l.productId?' selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="lgrid" style="grid-template-columns:1fr 1fr"><div class="f"><label>الكمية</label><input type="number" min="1" step="1" value="${esc(l.qty)}" data-pline="${k}" data-key="qty" ${locked?'disabled':''}></div><div class="f"><label>سعر الوحدة أرض المصنع $</label><input type="number" min="0" step="0.01" value="${esc(l.unitCost)}" data-pline="${k}" data-key="unitCost" ${locked?'disabled':''}></div></div><div class="ltot"><span class="xs muted">الكلفة الواصلة للوحدة</span><b id="pl_${k}">${M(ll[k]?.unit||0)}</b></div></div>`).join('');
  const pf=(label,key,hint='')=>`<div class="f"><label>${label}</label><input type="number" min="0" step="0.01" value="${esc(draft[key])}" data-pdraft="${key}" ${locked?'disabled':''}>${hint?`<div class="hint">${hint}</div>`:''}</div>`;
  let html=`<div class="grid2" style="align-items:start"><div class="stack">${locked?'<div class="info">الشحنة مستلمة ودخلت المخزون، لذلك لا يمكن تعديل الكميات والكلفة. يمكنك تعديل الملاحظات فقط.</div>':''}
  <div class="card"><div class="fgrid">${sel('المورد','supplierId',optsOf(db.suppliers,'غير محدد'),draft.supplierId,{attrs:`data-pdraft="supplierId" ${locked?'disabled':''}`})}${fld('التاريخ','date',draft.date,{type:'date',attrs:`data-pdraft="date" ${locked?'disabled':''}`})}</div></div>
  <div class="card"><div class="row between" style="margin-bottom:10px"><h2 style="margin:0">الأصناف</h2>${locked?'':`<button type="button" class="btn ghost sm" data-act="addPLine">${ic('plus')} صنف</button>`}</div><div class="lines">${lines}</div></div>
  <div class="card"><h2>مصاريف الشحنة</h2><div class="fgrid">${pf('الشحن $','freight')}${pf('الجمارك والتخليص $','customs','بدون TVA الاستيراد')}${pf('TVA الاستيراد $','customsVat','قابلة للاسترداد، لا تدخل في الكلفة')}${pf('مصاريف أخرى $','other')}</div></div>
  <div class="card"><div class="f"><label>ملاحظات / رقم البوليصة</label><textarea data-pdraft="notes">${esc(draft.notes)}</textarea></div></div></div>
  <div class="stack" style="position:sticky;top:76px"><div class="totals" id="purTotals">${purTotalsHtml()}</div>
  ${locked?`<button type="button" class="btn block" data-act="savePurchase">حفظ الملاحظات</button>`:`<div class="card stack" style="padding:12px">${chk('البضاعة وصلت المستودع (أضفها للمخزون)','received',draft.status==='received').replace('name="received"','name="received" data-pdraft="received"')}</div><button type="button" class="btn gold block" style="min-height:52px" data-act="savePurchase">${ic('check')} حفظ الشحنة</button>${draft.editId?`<button type="button" class="btn danger block" data-act="delPurchase" data-id="${draft.editId}">حذف الشحنة</button>`:''}`}</div></div>`;
  return{title:draft.editId?'الشحنة '+(byId(db.purchases,draft.editId)?.no||''):'شحنة جديدة',back:true,html};
};
function purTotalsHtml(){let tot=purchaseTotal(draft);return `<div class="r"><span>قيمة البضاعة</span>${M(draft.lines.reduce((a,l)=>a+n(l.qty)*n(l.unitCost),0))}</div><div class="r"><span>شحن وجمارك ومصاريف</span>${M(n(draft.freight)+n(draft.customs)+n(draft.other))}</div>${n(draft.customsVat)?`<div class="r"><span>TVA الاستيراد (تُسترد)</span>${M(draft.customsVat)}</div>`:''}<div class="r big"><span>الكلفة الواصلة</span>${M(tot)}</div>`}
function refreshPurchaseLight(){let ll=landedLines(draft);ll.forEach((l,k)=>{let el=$('#pl_'+k);if(el)el.innerHTML=M(l.unit)});let t=$('#purTotals');if(t)t.innerHTML=purTotalsHtml()}
async function savePurchase(){
  let locked=draft.editId&&byId(db.purchases,draft.editId)?.status==='received';
  if(locked){byId(db.purchases,draft.editId).notes=draft.notes;draft=null;save();back();toast('تم الحفظ');return}
  let lines=draft.lines.filter(l=>l.productId&&n(l.qty)>0);
  if(!lines.length)return msg('أدخل صنفاً بكمية أكبر من صفر.');
  if(lines.some(l=>!Number.isInteger(n(l.qty))))return msg('الكميات يجب أن تكون أرقاماً صحيحة.');
  if(lines.some(l=>n(l.unitCost)<0)||['freight','customs','customsVat','other'].some(k=>n(draft[k])<0))return msg('المبالغ لا يمكن أن تكون سالبة.');
  let o={supplierId:draft.supplierId,date:draft.date||today(),status:draft.status,lines:lines.map(l=>({productId:l.productId,qty:n(l.qty),unitCost:r2(l.unitCost)})),freight:r2(draft.freight),customs:r2(draft.customs),customsVat:r2(draft.customsVat),other:r2(draft.other),notes:draft.notes};
  if(o.status==='received'&&!(await ask('تأكيد استلام البضاعة وإضافتها إلى المخزون؟ بعد الاستلام لا يمكن تعديل الكميات والكلفة.')))return;
  if(draft.editId)Object.assign(byId(db.purchases,draft.editId),o);else{o.id=uid();o.no=nextNo('pur');db.purchases.push(o)}
  draft=null;save();hist=hist.filter(h=>h.page!=='purchaseEdit');go('purchases',null,false);toast(o.status==='received'?'تم استلام الشحنة وإضافتها للمخزون':'تم حفظ الشحنة');
}

/* ---------- expenses ---------- */
V.expenses=()=>{
  let m=ui.expMonth||today().slice(0,7);
  let list=db.expenses.filter(e=>e.date.slice(0,7)===m).sort((a,b)=>b.date.localeCompare(a.date));
  let tot=list.reduce((a,e)=>a+n(e.amount),0);
  let byT={};list.forEach(e=>byT[e.type]=(byT[e.type]||0)+n(e.amount));
  return{title:'المصاريف',html:`<div class="stack"><div class="row"><div class="f" style="width:180px"><input type="month" value="${m}" data-on="expMonth" aria-label="الشهر"></div><div class="grow"></div><button type="button" class="btn" data-act="expenseForm">${ic('plus')} مصروف</button></div>
  <div class="kpis" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="kpi hot"><div class="l">مصاريف الشهر</div><div class="v">${fmt0(tot)}</div></div><div class="kpi"><div class="l">عدد القيود</div><div class="v">${list.length}</div></div></div>
  ${Object.keys(byT).length?`<div class="card"><h2>حسب النوع</h2>${Object.entries(byT).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row between sm" style="padding:5px 0"><span>${esc(k)}</span><b>${M(v)}</b></div><div class="stockbar"><b style="width:${tot?v/tot*100:0}%;background:var(--wheat)"></b></div>`).join('')}</div>`:''}
  ${list.length?`<div class="list">${list.map(e=>`<div class="li"><span class="avatar">${ic('wallet')}</span><span style="min-width:0"><span class="t">${esc(e.type)}</span><br><span class="s">${dateAr(e.date)}${e.productId?' · '+esc(pName(e.productId)):''}${e.repId?' · '+esc(tName(e.repId)):''}${e.notes?' · '+esc(e.notes):''}</span></span><span class="end"><span class="amt">${fmt(e.amount)}</span><br><button type="button" class="btn danger sm" data-act="delExpense" data-id="${e.id}">حذف</button></span></div>`).join('')}</div>`:'<div class="card empty">لا مصاريف في هذا الشهر.</div>'}</div>`};
};
function expenseForm(){
  openSheet('مصروف جديد',`<div class="fgrid">${sel('النوع','type',EXPTYPES.map(x=>[x,x]))}${fld('المبلغ $','amount','',{type:'number',req:true,attrs:'min="0.01"'})}${fld('التاريخ','date',today(),{type:'date',req:true})}${sel('على منتج','productId',[['','مشترك'],...db.products.map(p=>[p.id,p.name])])}${sel('دفعه المندوب / السائق','repId',optsOf(db.team.filter(t=>t.role==='rep'||t.role==='driver'),'—'))}${area('ملاحظات','notes','')}</div>`,{save:()=>{

V.team=()=>({title:'الفريق والسيارات',html:`<div class="stack"><div class="row between"><div class="sm muted">المندوبون يظهرون في الفواتير والتحصيل والإقفال اليومي.</div><button type="button" class="btn" data-act="teamForm">${ic('plus')} إضافة</button></div>${['rep','driver','vehicle','admin'].map(r=>{let l=db.team.filter(t=>t.role===r);return `<div class="card"><h2>${{rep:'المندوبون',driver:'السائقون',vehicle:'السيارات',admin:'الإدارة'}[r]}<small>${l.length}</small></h2>${l.length?`<div class="list" style="border:0">${l.map(t=>`<button type="button" class="li" data-act="teamForm" data-id="${t.id}"><span class="avatar">${ic(r==='vehicle'?'truck':'users')}</span><span><span class="t">${esc(t.name)}</span><br><span class="s">${esc([t.area,t.phone].filter(Boolean).join(' · '))}</span></span></button>`).join('')}</div>`:`<div class="empty sm">لا أحد بعد.</div>`}</div>`}).join('')}</div>`});
function teamForm(id){

  let used=id&&(db.invoices.some(i=>i.repId===id||i.driverId===id||i.vehicleId===id)||db.payments.some(p=>p.repId===id)||db.customers.some(c=>c.repId===id));

function closingData(rep,d){
  let invs=db.invoices.filter(i=>i.status==='delivered'&&i.repId===rep&&(i.deliveredAt||i.date)===d);
  let pays=db.payments.filter(p=>p.repId===rep&&p.date===d);
  let exps=db.expenses.filter(e=>e.repId===rep&&e.date===d);
  let sales=invs.reduce((a,i)=>a+invGross(i),0),cash=pays.filter(p=>p.method==='cash').reduce((a,p)=>a+n(p.amount),0),other=pays.filter(p=>p.method!=='cash').reduce((a,p)=>a+n(p.amount),0),ex=exps.reduce((a,e)=>a+n(e.amount),0);
  return{invs,pays,exps,sales,cash,other,ex,due:cash-ex,cartons:invs.reduce((a,i)=>a+invCartons(i),0)};
}

   if(await ask('هل قبضت المبلغ نقداً الآن؟',{ok:'نعم، سجّل القبض'})){db.payments.push({id:uid(),no:nextNo('pay'),date:today(),customerId:i.customerId,invoiceId:i.id,amount:invGross(i),method:'cash',repId:i.repId,notes:'قبض عند التسليم'});commit('تم تسجيل القبض')}},
 cancelInvoice:async d=>{let i=INV(d.id);if(!i||i.status!=='pending')return;if(await ask(`إلغاء الفاتورة ${i.no}؟ تتحرر الكمية المحجوزة.`,{danger:true,ok:'إلغاء الفاتورة'})){i.status='cancelled';commit('تم إلغاء الفاتورة')}},
 printInvoice:d=>showDoc('طباعة الفاتورة',invoiceDoc(INV(d.id))),
 printStatement:d=>showDoc('كشف حساب',statementDoc(d.id)),
 printClosing:()=>showDoc('إقفال المندوب',closingDoc(ui.closing.rep,ui.closing.date)),
 doPrint:()=>doPrint(),
 newReturn:d=>startReturn(d.id),
 delReturn:async d=>{if(await ask('حذف المرتجع؟ ستعود الكمية مباعة ويعود المبلغ على الزبون.',{danger:true,ok:'حذف'})){db.returns=db.returns.filter(x=>x.id!==d.id);commit('تم حذف المرتجع')}},
 invFilter:d=>{ui.invFilter=d.v;render()},
 custType:d=>{ui.custType=d.v;render()},
 customerForm:d=>customerForm(d.id),
 delCustomer:async d=>{if(await ask('حذف هذا الزبون؟',{danger:true,ok:'حذف'})){db.customers=db.customers.filter(x=>x.id!==d.id);closeSheet();hist=[];go('customers',null,false);toast('تم الحذف')}},
 newPayment:d=>paymentForm(d.customer||'',d.invoice||''),
 delPayment:async d=>{if(await ask('حذف سند القبض؟ سيعود المبلغ ديناً على الزبون.',{danger:true,ok:'حذف'})){db.payments=db.payments.filter(x=>x.id!==d.id);commit('تم حذف السند')}},
 productForm:d=>productForm(d.id),
 delProduct:async d=>{if(await ask('حذف المنتج نهائياً؟',{danger:true,ok:'حذف'})){db.products=db.products.filter(x=>x.id!==d.id);closeSheet();commit('تم الحذف')}},
 adjustForm:()=>adjustForm(),
 openingForm:()=>openingForm(),
 delAdjust:async d=>{if(await ask('حذف التسوية؟',{danger:true,ok:'حذف'})){db.adjustments=db.adjustments.filter(x=>x.id!==d.id);commit('تم الحذف')}},
 newPurchase:()=>startPurchase(),
 editPurchase:d=>startPurchase(d.id),
 addPLine:()=>{draft.lines.push({productId:db.products[0]?.id||'',qty:'',unitCost:''});render()},
 rmPLine:d=>{draft.lines.splice(+d.k,1);if(!draft.lines.length)draft.lines.push({productId:db.products[0]?.id||'',qty:'',unitCost:''});render()},
 savePurchase:()=>savePurchase(),
 delPurchase:async d=>{let pu=byId(db.purchases,d.id);if(!pu)return;if(pu.status==='received'){let after=pu.lines.every(l=>availOf(l.productId)-n(l.qty)>=0);if(!after)return msg('لا يمكن حذف شحنة مستلمة بيعت بضاعتها. سجّل تسوية مخزون بدلاً من ذلك.')}
   if(await ask('حذف الشحنة '+pu.no+'؟'+(pu.status==='received'?' ستُخصم كميتها من المخزون.':''),{danger:true,ok:'حذف'})){db.purchases=db.purchases.filter(x=>x.id!==d.id);draft=null;save();hist=[];go('purchases',null,false);toast('تم حذف الشحنة')}},
 expenseForm:()=>expenseForm(),
 delExpense:async d=>{if(await ask('حذف المصروف؟',{danger:true,ok:'حذف'})){db.expenses=db.expenses.filter(x=>x.id!==d.id);commit('تم الحذف')}},
 teamForm:d=>teamForm(d.id),
 delTeam:async d=>{if(await ask('حذف؟',{danger:true,ok:'حذف'})){db.team=db.team.filter(x=>x.id!==d.id);closeSheet();commit('تم الحذف')}},
 supplierForm:d=>supplierForm(d.id),
 delSupplier:async d=>{if(await ask('حذف المورد؟',{danger:true,ok:'حذف'})){db.suppliers=db.suppliers.filter(x=>x.id!==d.id);closeSheet();commit('تم الحذف')}},
 rptPreset:d=>{ui.rpt.preset=d.v;if(d.v==='custom'&&!ui.rpt.from){ui.rpt.from=today().slice(0,8)+'01';ui.rpt.to=today()}render()},
 exportCSV:()=>exportCSV(),
 saveSettings:()=>{let b=$('#setForm');if(!validate(b))return;let f=readForm(b);Object.assign(db.settings,{company:f.company.trim()||'BILBOX',phone:f.phone.trim(),address:f.address.trim(),vatNo:f.vatNo.trim(),vat:r2(f.vat),footer:f.footer.trim()});commit('تم حفظ الإعدادات')},
 exportBackup:()=>exportBackup(),
 copyBackup:()=>{let t=$('#bkText');t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>toast('تم النسخ'),()=>ok&&toast('تم النسخ'));else if(ok)toast('تم النسخ')},
 importBackup:()=>importBackup(),
 demoData:async()=>{if(await ask('إضافة 4 زبائن تجريبيين وشحنة 2,500 كرتونة و6 فواتير؟'))demoData()},
 resetAll:async()=>{let v=await ask('لحذف كل البيانات نهائياً، اكتب كلمة حذف ثم اضغط تأكيد.',{input:true,danger:true,ok:'حذف نهائي'});if(v==='حذف'){db=defaults();hist=[];draft=null;save();go('dashboard',null,false);toast('تم حذف كل البيانات')}else if(v!=null)msg('لم يتم الحذف: الكلمة غير مطابقة.')}
};
document.addEventListener('click',e=>{let el=e.target.closest('[data-act]');if(!el)return;let fn=A[el.dataset.act];if(fn){e.preventDefault();fn(el.dataset,el)}});
// input handlers
const ON={
 invQ:v=>{ui.invQ=v;let a=$('#listArea');if(a)a.innerHTML=invListHtml()},custQ:v=>{ui.custQ=v;let a=$('#listArea');if(a)a.innerHTML=custListHtml()},
 repFilter:v=>{ui.repFilter=v;render()},expMonth:v=>{ui.expMonth=v;render()},
 closingRep:v=>{ui.closing.rep=v;render()},closingDate:v=>{ui.closing.date=v||today();render()},
 rptFrom:v=>{ui.rpt.from=v;render()},rptTo:v=>{ui.rpt.to=v;render()},
 payCust:v=>{let a=$('#sheetBody [name=amount]'),r=$('#sheetBody [name=repId]');let b=custBalance(v);if(a)a.value=b>0?r2(b):'';let c=C(v);if(r&&c?.repId)r.value=c.repId}
};
function handleField(e){
  let el=e.target;
  if(el.dataset.on&&ON[el.dataset.on]){ON[el.dataset.on](el.value);return}
  if(!draft)return;
  if(el.dataset.line!=null){if(el.tagName==='SELECT'&&e.type!=='change')return;onLineChange(+el.dataset.line,el.dataset.key,el.value,el);return}
  if(el.dataset.draft){let k=el.dataset.draft,v=el.type==='checkbox'?el.checked:el.value;draft[k]=v;
    if(k==='customerId'&&e.type==='change'){let c=C(v);draft.repId=draft.repId||c?.repId||'';for(const l of draft.lines){let p=P(l.productId);l.price=priceFor(p,c);if(l.auto)l.free=promoFree(p,c,l.qty)}render()}
    else if(k==='cashNow'&&v){draft.deliverNow=true;render()}else if(k==='deliverNow'&&!v&&draft.cashNow){draft.cashNow=false;render()}
    return}
  if(el.dataset.pline!=null){let l=draft.lines[+el.dataset.pline];l[el.dataset.key]=el.value;refreshPurchaseLight();return}
  if(el.dataset.pdraft){let k=el.dataset.pdraft;if(k==='received'){draft.status=el.checked?'received':'pending';return}draft[k]=el.value;if(['freight','customs','other','customsVat'].includes(k))refreshPurchaseLight();return}
}
document.addEventListener('input',e=>{let el=e.target;if(el.tagName==='SELECT'||el.type==='checkbox'||el.type==='date'||el.type==='month'||el.type==='file')return;handleField(e)});
document.addEventListener('change',e=>{let el=e.target;if(el.tagName==='SELECT'||el.type==='checkbox'||el.type==='date'||el.type==='month')handleField(e)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#dlg').classList.contains('show'))$('#dlgCancel').click();else if($('#sheet').classList.contains('show'))closeSheet()}
  if(e.key==='Enter'&&e.target.tagName==='INPUT'){if(e.target.id==='dlgInput'){e.preventDefault();$('#dlgOk').click()}else if(e.target.closest('#sheetBody')&&$('#sheetSaveBtn')){e.preventDefault();$('#sheetSaveBtn').click()}}
});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
window.addEventListener('beforeunload',e=>{if(draft){e.preventDefault();e.returnValue=''}});
loadDb();
render();
</script>
